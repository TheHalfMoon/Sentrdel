[workspace]
members = [
  "crates/sentrdel-schema",
  "crates/sentrdel-store",
  "crates/sentrdel-graph",
  "crates/sentrdel-engine",
  "crates/sentrdel-policy",
  "crates/sentrdel-guard",
  "crates/sentrdel-review",
  "crates/sentrdel-verify",
  "crates/sentrdel-cli",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
repository = "https://github.com/TheHalfMoon/Sentrdel"
authors = ["TheHalfMoon"]
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = { version = "=1.2.2", features = ["derive"] }
sha2 = { version = "=0.11.0", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
regorus = { version = "=0.11.0", default-features = false, features = ["std", "arc"] }
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "index", "revision"] }
ast-grep-core = { version = "=0.45.2", default-features = false, features = ["tree-sitter"] }
tree-sitter = "=0.26.13"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = { version = "=0.23.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sentrdel_internal_test)"] }

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "deny"
