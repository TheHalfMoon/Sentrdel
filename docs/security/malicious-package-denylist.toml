# Defense-in-depth denylist for Sentrdel's trusted Rust workspace.
#
# This list complements, and never replaces, the live RustSec checks performed by
# cargo-audit/cargo-deny. Entries are limited to packages for which the referenced
# RustSec advisory classifies the package as malicious and reports no patched
# versions. Version-scoped advisories remain the authority of RustSec tooling so
# this file does not accidentally ban known-good versions.
#
# Refresh source: https://rustsec.org/advisories/
# Snapshot reviewed: 2026-08-29

