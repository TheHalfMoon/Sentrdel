name: T072 Closeout

on:
  push:
    branches:
      - closeout/001-t072-local-ollama-reasoner

permissions:
  contents: write

jobs:
  closeout:
    name: Record canonical T072 completion
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t072-local-ollama-reasoner
      - name: Mark T072 complete once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] T072 [P] [US5] Implement local HTTP/Ollama-compatible adapter behind feature/config gate.'
          new = '- [x] T072 [P] [US5] Implement local HTTP/Ollama-compatible adapter behind feature/config gate.'
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('T072 task line missing or ambiguous')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          if git diff --quiet -- specs/001-v0-1-evidence-guard-foundation/tasks.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): mark T072 complete'
          git push origin HEAD:closeout/001-t072-local-ollama-reasoner
