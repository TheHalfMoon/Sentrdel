name: Temporary R3 T009 Template Repair

on:
  push:
    branches:
      - feat/r3-t009-bounded-route-extraction

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact T009 branch
        uses: actions/checkout@v4
        with:
          ref: feat/r3-t009-bounded-route-extraction
          fetch-depth: 0

      - name: Verify temporary-only staging delta
        env:
          PRODUCT_BASE: d0a1b8a8a4339bb5faf709f1cb35d3aaeafd9ca6
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$PRODUCT_BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            .github/tmp-r3-t009-template-mask.py
            .github/workflows/tmp-r3-t009-template-repair.yml
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Apply parser-owned template repair
        run: python .github/tmp-r3-t009-template-mask.py

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0

      - name: Verify repaired T009 candidate
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p sentrdel-review --test r3_t009_route_extraction
          cargo clippy -p sentrdel-review --all-targets -- -D warnings

      - name: Commit guarded product repair
        env:
          BRANCH: feat/r3-t009-bounded-route-extraction
        run: |
          set -euo pipefail
          rm .github/tmp-r3-t009-template-mask.py
          rm .github/workflows/tmp-r3-t009-template-repair.yml
          git add -A
          mapfile -t changed < <(git diff --cached --name-only | sort)
          allowed=(
            crates/sentrdel-review/src/business_logic/route.rs
            crates/sentrdel-review/tests/r3_t009_route_extraction.rs
            .github/tmp-r3-t009-template-mask.py
            .github/workflows/tmp-r3-t009-template-repair.yml
          )
          mapfile -t allowed_sorted < <(printf '%s\n' "${allowed[@]}" | sort)
          diff -u <(printf '%s\n' "${allowed_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r3): preserve executable template substitutions'
          remote_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          parent=$(git rev-parse HEAD^)
          test "$remote_head" = "$parent"
          git push origin "HEAD:refs/heads/$BRANCH"
