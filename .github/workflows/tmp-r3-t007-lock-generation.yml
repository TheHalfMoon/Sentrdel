name: Temporary R3 T007 Lock Generation

on:
  push:
    branches:
      - feat/r3-t007-typescript-grammar-qualification

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t007-typescript-grammar-qualification
          fetch-depth: 0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Resolve candidate lockfile in trusted workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 check -p sentrdel-review
          changed="$(git status --short --untracked-files=no)"
          printf '%s\n' "$changed"
          test "$changed" = ' M Cargo.lock'
          git diff --check -- Cargo.lock

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(r3): lock TypeScript grammar candidate"
          git push origin HEAD:feat/r3-t007-typescript-grammar-qualification
