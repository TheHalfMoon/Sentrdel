name: T065 Closeout

on:
  push:
    branches:
      - closeout/001-t065-init-output

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t065-init-output
      - name: Mark T065 complete and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T065 [US3] Implement `sentrdel init` human/JSON output including explicit pack coverage dimensions.'
          new = '- [x] T065 [US3] Implement `sentrdel init` human/JSON output including explicit pack coverage dimensions.'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one unchecked T065 line')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m "docs(spec): mark T065 complete"
          git rm .github/workflows/t065-closeout.yml
          git commit -m "ci(temp): remove T065 closeout workflow"
          git push origin HEAD:closeout/001-t065-init-output
