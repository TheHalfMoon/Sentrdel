name: T077 Temporary Closeout

on:
  push:
    branches:
      - closeout/001-t077-r1-release-benchmark

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t077-r1-release-benchmark
          fetch-depth: 1

      - name: Record canonical T077 completion and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T077 **Expand** the T088-T090 SentrdelBench Core into the complete reproducible R1 release benchmark for clean/vulnerable PRs, false positives, latency, memory, guard false-block, MCP malformed-input and authority-boundary scenarios; public large-scale SentrdelBench remains roadmap R9.'
          new = old.replace('- [ ] T077', '- [x] T077', 1)
          if text.count(old) != 1:
              raise SystemExit('T077 closeout target not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/t077-closeout-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git diff --cached --check
          git commit -m "docs(spec): close T077 release benchmark task"
          git push origin HEAD:closeout/001-t077-r1-release-benchmark
