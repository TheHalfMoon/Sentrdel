name: Temporary T076 Rustfmt

on:
  push:
    branches:
      - impl/001-t076-reason-network-wiring

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply canonical formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          rm .github/workflows/temp-t076-rustfmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/review_reasoning.rs crates/sentrdel-cli/tests/t076_reasoning_flags.rs .github/workflows/temp-t076-rustfmt.yml
          git commit -m 'style(cli): apply Rust 1.98 formatting to T076'
          git push origin HEAD:impl/001-t076-reason-network-wiring
