name: T087 Closeout Temp

on:
  push:
    branches:
      - closeout/001-t087-implementation-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Mark T087 complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T087 Run implementation closeout:'
          new = '- [x] T087 Run implementation closeout:'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('T087 task line not found in expected state')
          PY
          if git diff --quiet -- specs/001-v0-1-evidence-guard-foundation/tasks.md; then
            echo 'T087 already marked complete.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): close T087 implementation task'
          git push origin HEAD:closeout/001-t087-implementation-closeout
