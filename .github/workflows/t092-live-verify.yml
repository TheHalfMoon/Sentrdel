name: T092 Live Governance Verification

on:
  push:
    branches:
      - verify/t092-live-20260829-0727

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify protected main with bounded administrator credential
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          SENTRDEL_FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN
          if [[ -n "${SENTRDEL_GOVERNANCE_ADMIN_TOKEN:-}" ]]; then
            export GH_TOKEN="$SENTRDEL_GOVERNANCE_ADMIN_TOKEN"
            echo "governance-credential: SENTRDEL_GOVERNANCE_ADMIN_TOKEN"
          elif [[ -n "${SENTRDEL_FALLBACK_GH_TOKEN:-}" ]]; then
            export GH_TOKEN="$SENTRDEL_FALLBACK_GH_TOKEN"
            echo "governance-credential: GH_TOKEN"
          else
            echo "governance-credential: unavailable" >&2
            exit 1
          fi
          python3 scripts/verify_repository_governance.py
