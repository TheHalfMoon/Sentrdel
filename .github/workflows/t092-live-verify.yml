name: T092 Live Governance Verify

on:
  push:
    branches:
      - verify/t092-live-20260829-1051

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      SENTRDEL_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
      FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: verify/t092-live-20260829-1051
          persist-credentials: true
          fetch-depth: 1
      - name: Verify live protected-main governance read-only
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN || true
          if [ -n "${SENTRDEL_ADMIN_TOKEN:-}" ]; then
            export GH_TOKEN="$SENTRDEL_ADMIN_TOKEN"
          elif [ -n "${FALLBACK_GH_TOKEN:-}" ]; then
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
          else
            echo 'repository-governance: NO_BOUNDED_CREDENTIAL'
            exit 78
          fi
          python3 scripts/verify_repository_governance.py --repository TheHalfMoon/Sentrdel --branch main
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/t092-live-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/t092-live-verify.yml
          if ! git diff --cached --quiet; then
            git commit -m 'ci(temp): remove T092 live governance verifier'
            git push origin HEAD:verify/t092-live-20260829-1051
          fi
