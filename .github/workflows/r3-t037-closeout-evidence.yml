name: R3 T037 Implementation Closeout Evidence

on:
  push:
    branches:
      - evidence/r3-t037-closeout-988422b

permissions:
  contents: read

jobs:
  closeout-evidence:
    name: R3 T037 closeout evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Record machine and toolchain metadata
        run: |
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          uname -a
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose
          lscpu || true
          free -h || true

      - name: Format workspace
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check workspace
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked -- --nocapture

      - name: Clippy workspace
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run R3 release benchmark
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t031_release_benchmark --locked -- --nocapture

      - name: Run R3 latency and resource benchmark
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t032_latency_resource_benchmark --locked -- --nocapture

      - name: Validate R3 benchmark sample-count contract
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t032_sample_count_contract --locked -- --nocapture

      - name: Run R2 static authority secret and no-execution canaries
        run: cargo +1.98.0 test -p sentrdel-review --test r2_phase4_adversarial --locked -- --nocapture

      - name: Run R3 supported-path and authority canaries
        run: cargo +1.98.0 test -p sentrdel-cli r3_t030_e2e --locked -- --nocapture

      - name: Run R3 adversarial extraction canaries
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t014_extraction_adversarial --locked -- --nocapture

      - name: Run guard seam qualification
        run: cargo +1.98.0 test -p sentrdel-guard --locked -- --nocapture

      - name: Require dedicated governance credential
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
        run: |
          if [ -z "${SENTRDEL_GOVERNANCE_ADMIN_TOKEN:-}" ]; then
            echo "repository-governance: ERROR: SENTRDEL_GOVERNANCE_ADMIN_TOKEN is unavailable" >&2
            exit 1
          fi

      - name: Verify live repository governance
        env:
          GITHUB_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          GH_TOKEN: ""
        run: python3 scripts/verify_repository_governance.py
