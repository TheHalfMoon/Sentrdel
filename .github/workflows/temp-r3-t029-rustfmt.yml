name: Temporary R3-T029 rustfmt

on:
  push:
    branches:
      - feat/r3-t029-explain-business-logic

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t029-explain-business-logic
          persist-credentials: true
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format R3-T029 sources
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          changed="$(git diff --name-only)"
          if [[ -z "${changed}" ]]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "${changed}" | grep -vFx 'crates/sentrdel-cli/src/explain_business_logic.rs' || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'unexpected rustfmt paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/explain_business_logic.rs
          git commit -m 'style(r3): apply rustfmt to T029 explain context'
          git push origin HEAD:feat/r3-t029-explain-business-logic
