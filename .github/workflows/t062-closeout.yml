name: T062 Closeout

on:
  push:
    branches:
      - closeout/001-t062-supabase-detection

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Record canonical T062 completion and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T062 [P] [US3] Implement **Supabase detection only** with positive/negative fixtures; R1 output explicitly marks static posture NOT_IMPLEMENTED/PARTIAL and points to roadmap R2 without making a verdict.'
          new = old.replace('- [ ]', '- [x]', 1)
          if text.count(old) != 1:
              raise SystemExit('expected exactly one open T062 task line')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): close T062 Supabase detection task'
          git rm .github/workflows/t062-closeout.yml
          git commit -m 'ci(temp): remove T062 closeout workflow'
          git push origin HEAD:closeout/001-t062-supabase-detection
