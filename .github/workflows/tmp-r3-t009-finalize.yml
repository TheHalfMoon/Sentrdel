name: Temporary R3 T009 Finalizer

on:
  push:
    branches:
      - feat/r3-t009-bounded-route-extraction

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T009 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t009-bounded-route-extraction
          fetch-depth: 0

      - name: Apply bounded candidate finalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          route = Path('crates/sentrdel-review/src/business_logic/route.rs')
          text = route.read_text(encoding='utf-8')
          lines = text.splitlines()
          starts = [
              i for i, line in enumerate(lines)
              if line.strip() == "if mask.get(cursor) == Some(&b'[') {"
              and i + 1 < len(lines)
              and lines[i + 1].strip() == "if let Some(close) = find_balanced(mask, cursor, b'[', b']') {"
          ]
          if len(starts) != 1:
              raise SystemExit(f'expected exactly one T009 collapsible-if opening, got {len(starts)}')
          start = starts[0]
          target = next(
              (i for i in range(start + 2, len(lines))
               if lines[i].strip() == "if mask.get(cursor) != Some(&b'.') {"),
              None,
          )
          if target is None:
              raise SystemExit('missing T009 post-dynamic-registration target')
          closings = [i for i in range(start + 2, target) if lines[i].strip() == '}']
          if len(closings) != 3:
              raise SystemExit(f'expected exactly three closing braces in T009 block, got {len(closings)}')
          del lines[closings[-2]]
          indent = lines[start][:-len(lines[start].lstrip())]
          lines[start:start + 2] = [
              indent + "if mask.get(cursor) == Some(&b'[')",
              indent + "    && let Some(close) = find_balanced(mask, cursor, b'[', b']')",
              indent + "{",
          ]
          route.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          tasks = Path('specs/003-business-logic-invariants/tasks.md')
          text = tasks.read_text(encoding='utf-8')
          old = '- [ ] **R3-T009** Implement bounded route extraction for the frozen initial adapters: Express-style method/path/callback chains, Next.js App Router Route Handlers, Next.js Pages API routes and supported Supabase Edge Function handlers; unsupported dynamic registration/middleware becomes explicit coverage.'
          new = old.replace('- [ ]', '- [x]', 1)
          if text.count(old) != 1:
              raise SystemExit('expected exactly one open R3-T009 ledger entry')
          tasks.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Install pinned Rust formatter
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format and validate diff
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          git diff --check
          git diff -- crates/sentrdel-review/src/business_logic/route.rs specs/003-business-logic-invariants/tasks.md

      - name: Commit candidate finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review/src/business_logic/route.rs specs/003-business-logic-invariants/tasks.md
          git diff --cached --check
          git commit -m "fix(r3): finalize T009 route extraction candidate"
          git push origin HEAD:feat/r3-t009-bounded-route-extraction
