name: Temporary R3 T009 Exact Review Reconciliation

on:
  push:
    branches:
      - feat/r3-t009-bounded-route-extraction
    paths:
      - .github/workflows/tmp-r3-t009-exact-review-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/r3-t009-bounded-route-extraction
          fetch-depth: 0
          persist-credentials: true

      - name: Guard expected qualification head and temporary-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected=104ca20fd4fdd5523e239746cf4c77d3d7d71e59
          git fetch origin feat/r3-t009-bounded-route-extraction
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/r3-t009-bounded-route-extraction)"
          git merge-base --is-ancestor "$expected" HEAD
          mapfile -t changed < <(git diff --name-only "$expected"..HEAD | sort)
          expected_changed=(
            ".github/workflows/tmp-r3-t009-exact-review-reconcile.yml"
            "scripts/tmp_r3_t009_exact_review_reconcile.py"
          )
          if [[ "${changed[*]}" != "${expected_changed[*]}" ]]; then
            printf 'unexpected pre-repair changed paths:\n%s\n' "${changed[*]}"
            exit 1
          fi

      - name: Apply bounded four-finding reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_r3_t009_exact_review_reconcile.py

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all

      - name: Run sentrdel-review library tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test -p sentrdel-review --lib

      - name: Run focused T009 regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test -p sentrdel-review --test r3_t009_route_extraction

      - name: Run focused Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy -p sentrdel-review --all-targets -- -D warnings

      - name: Remove temporary reconciliation artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-r3-t009-exact-review-reconcile.yml
          rm scripts/tmp_r3_t009_exact_review_reconcile.py

      - name: Guard final product diff and push product-only repair
        shell: bash
        run: |
          set -euo pipefail
          expected=104ca20fd4fdd5523e239746cf4c77d3d7d71e59
          git fetch origin feat/r3-t009-bounded-route-extraction
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/r3-t009-bounded-route-extraction)"
          git diff --check "$expected"
          mapfile -t changed < <(git diff --name-only "$expected" | sort)
          expected_changed=(
            "crates/sentrdel-review/src/business_logic/route.rs"
            "crates/sentrdel-review/tests/r3_t009_route_extraction.rs"
          )
          if [[ "${changed[*]}" != "${expected_changed[*]}" ]]; then
            printf 'unexpected final product paths:\n%s\n' "${changed[*]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(r3): reconcile exact-head route review findings"
          git push origin HEAD:feat/r3-t009-bounded-route-extraction
