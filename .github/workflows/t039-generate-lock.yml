name: T039 Temporary Lockfile Generation

on:
  push:
    branches:
      - impl/001-t039-native-structural-framework

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Generate lockfile in trusted workspace
        run: cargo +1.98.0 generate-lockfile
      - name: Commit generated lockfile through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}/contents/Cargo.lock?ref={branch}'
          request = urllib.request.Request(api, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request) as response:
              current = json.load(response)

          payload = json.dumps({
              'message': 'build(review): resolve T039 dependency closure',
              'content': base64.b64encode(Path('Cargo.lock').read_bytes()).decode('ascii'),
              'sha': current['sha'],
              'branch': branch,
          }).encode('utf-8')
          update = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/Cargo.lock',
              data=payload,
              method='PUT',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(update) as response:
              result = json.load(response)
          print(f"updated Cargo.lock at {result['commit']['sha']}")
          PY
