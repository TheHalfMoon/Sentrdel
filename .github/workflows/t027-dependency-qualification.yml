name: T027 Dependency Qualification
# Temporary T027 gate. Remove before canonical merge; T082 owns durable self-security CI.

on:
  push:
    branches:
      - 'impl/001-t027-engine-process-runner'

permissions:
  contents: read

jobs:
  qualify-process-wrap:
    name: Qualify process-wrap 9.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Generate candidate lockfile
        run: cargo +1.98.0 generate-lockfile

      - name: Show exact dependency tree
        run: cargo +1.98.0 tree --workspace --locked

      - name: Upload candidate lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t027-candidate-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Emit candidate lockfile for audit trail
        run: |
          set -euo pipefail
          echo 'BEGIN_T027_CARGO_LOCK_BASE64'
          base64 -w0 Cargo.lock
          echo
          echo 'END_T027_CARGO_LOCK_BASE64'

      - name: Rust 1.98 semantic qualification
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 check --workspace --all-targets --locked
          cargo +1.98.0 test --workspace --locked
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Install pinned dependency-audit tools
        run: |
          set -euo pipefail
          cargo +1.98.0 install cargo-audit --version 0.22.0 --locked
          cargo +1.98.0 install cargo-deny --version 0.20.2 --locked

      - name: RustSec audit trusted workspace
        run: cargo +1.98.0 audit

      - name: cargo-deny trusted workspace
        run: cargo +1.98.0 deny check
