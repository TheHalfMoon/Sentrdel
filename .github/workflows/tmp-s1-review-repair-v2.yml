name: Temporary S1 Review Repair V2

on:
  push:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply exact review repairs
        run: python scripts/tmp_s1_review_repair.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format repaired sources
        run: cargo +1.98.0 fmt --all
      - name: Test repaired regression model
        run: cargo +1.98.0 test -p sentrdel-review --locked regression::model
      - name: Test repaired S1 Phase 1 contract
        run: cargo +1.98.0 test -p sentrdel-review --locked --test s1_phase1_contract
      - name: Commit repaired files to temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/sentrdel-review/src/regression/model.rs crates/sentrdel-review/tests/s1_phase1_contract.rs
          git diff --cached --quiet && exit 1
          git commit -m "fix(s1): enforce aggregate bounds and canary presence"
          git push origin HEAD:${GITHUB_REF_NAME}
