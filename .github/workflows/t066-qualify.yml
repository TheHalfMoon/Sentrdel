name: T066 Qualify

on:
  push:
    branches:
      - test/001-t066-init-adversarial

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/001-t066-init-adversarial
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format and run T066 tests
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p sentrdel-cli --test t066_init_adversarial
      - name: Commit formatted test and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-cli/tests/t066_init_adversarial.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt for T066"
          fi
          git rm .github/workflows/t066-qualify.yml
          git commit -m "ci(temp): remove T066 qualification workflow"
          git push origin HEAD:test/001-t066-init-adversarial
