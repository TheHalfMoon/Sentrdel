name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main
      - impl/001-v0-1-foundation

permissions:
  contents: read

jobs:
  rust-bootstrap:
    name: Rust 1.98 bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        # actions/checkout v4.4.0 — pin the immutable commit, never the mutable v4 tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain
        run: |
          rustc +1.98.0 --version
          cargo +1.98.0 --version

      - name: Prepare exact T023 qualification source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sentrdel-policy/src/rego.rs')
          text = path.read_text()
          needle = 'pub struct BoundedRegoPolicy {'
          replacement = '#[derive(Debug)]\n' + needle
          if '#[derive(Debug)]\n' + needle not in text:
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          echo 'T023_FORMATTED_REGO_BASE64_BEGIN'
          base64 -w0 crates/sentrdel-policy/src/rego.rs
          echo
          echo 'T023_FORMATTED_REGO_BASE64_END'
          git diff --check

      - name: Check workspace
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
