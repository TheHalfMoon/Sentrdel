name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main
      - impl/001-v0-1-foundation

permissions:
  contents: read

jobs:
  rust-bootstrap:
    name: Rust 1.98 bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        # actions/checkout v4.4.0 — pin the immutable commit, never the mutable v4 tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain
        run: |
          rustc +1.98.0 --version
          cargo +1.98.0 --version

      # TEMPORARY T016 QUALIFICATION STEPS. Remove after the generated lockfile
      # is committed. They run only against Sentrdel's trusted workspace.
      - name: Resolve candidate lockfile
        run: cargo +1.98.0 generate-lockfile

      - name: Upload candidate lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentrdel-t016-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Format
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check workspace
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
