name: Bootstrap CI

on:
  pull_request:
  push:
    branches:
      - main
      - impl/001-v0-1-foundation

permissions:
  contents: read

jobs:
  rust-bootstrap:
    name: Rust 1.98 bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        # actions/checkout v4.4.0 — pin the immutable commit, never the mutable v4 tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain
        run: |
          rustc +1.98.0 --version
          cargo +1.98.0 --version

      # TEMPORARY T016 QUALIFICATION STEP. Remove after the generated lockfile is
      # committed. This runs only Cargo resolution for Sentrdel's trusted workspace;
      # it does not execute a target repository.
      - name: Resolve and emit candidate lockfile
        run: |
          cargo +1.98.0 generate-lockfile
          echo 'SENTRDEL_T016_LOCKFILE_BEGIN'
          base64 -w 0 Cargo.lock
          echo
          echo 'SENTRDEL_T016_LOCKFILE_END'

      - name: Format
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check workspace
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
