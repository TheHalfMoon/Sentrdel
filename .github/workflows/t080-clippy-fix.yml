name: T080 Clippy Fix

on:
  push:
    branches:
      - impl/001-t080-mcp-policy-latency-memory

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t080-mcp-policy-latency-memory
      - name: Remove single-element deferred loop
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("crates/sentrdel-cli/tests/t077_release_benchmark.rs"); t=p.read_text(); old="    for (deferred, owner) in [(\"review_memory\", \"T079\")] {\n        assert_eq!(dimensions[deferred].state, MetricState::NotMeasured);\n        assert_eq!(dimensions[deferred].owner_task, owner);\n    }\n"; new="    assert_eq!(dimensions[\"review_memory\"].state, MetricState::NotMeasured);\n    assert_eq!(dimensions[\"review_memory\"].owner_task, \"T079\");\n"; assert t.count(old)==1; p.write_text(t.replace(old,new,1))'
          rm .github/workflows/t080-clippy-fix.yml
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --all
          cargo +1.98.0 clippy -p sentrdel-cli --test t077_release_benchmark -- -D warnings
          cargo +1.98.0 test -p sentrdel-cli --test t077_release_benchmark
          cargo +1.98.0 test -p sentrdel-guard --test t080_mcp_policy_benchmark
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/tests/t077_release_benchmark.rs .github/workflows/t080-clippy-fix.yml
          git commit -m 'test(bench): fix T080 release-suite clippy gate'
          git push origin HEAD:impl/001-t080-mcp-policy-latency-memory
