name: T052 Closeout

on:
  push:
    branches:
      - closeout/001-t052-mcp-gateway

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t052-mcp-gateway
      - name: Record T052 canonical completion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T052 [US2] Implement stdio gateway normalization, pre-invocation policy, scoped approval and forwarding with max frame/buffer/args/result limits and fail-closed protocol errors; forwarding uses the T093 scrubbed environment/capability boundary.'
          new = old.replace('- [ ]', '- [x]', 1)
          if text.count(old) != 1:
              raise SystemExit('expected exactly one unchecked T052 task line')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/t052-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): close T052 MCP gateway task'
          git push origin HEAD:closeout/001-t052-mcp-gateway
