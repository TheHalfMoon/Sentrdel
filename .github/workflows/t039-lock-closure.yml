name: T039 Lock Closure Verification

on:
  push:
    branches:
      - verify/t039-lock-closure

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Add qualified T039 dependencies in ephemeral checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('Cargo.toml')
          text = root.read_text()
          needle = 'gix = { version = "=0.87.1", default-features = false, features = ["sha1", "index", "revision"] }\n'
          replacement = needle + 'ast-grep-core = { version = "=0.45.2", default-features = false, features = ["tree-sitter"] }\ntree-sitter = "=0.26.13"\ntree-sitter-javascript = "=0.25.0"\n'
          if needle not in text:
              raise SystemExit('workspace dependency anchor missing')
          root.write_text(text.replace(needle, replacement, 1))

          review = Path('crates/sentrdel-review/Cargo.toml')
          text = review.read_text()
          needle = 'gix.workspace = true\n'
          replacement = needle + 'ast-grep-core.workspace = true\ntree-sitter.workspace = true\ntree-sitter-javascript.workspace = true\n'
          if needle not in text:
              raise SystemExit('review dependency anchor missing')
          review.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Resolve lockfile and metadata
        run: |
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 metadata --locked --format-version 1 > t039-metadata.json
      - name: Upload lock closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t039-lock-closure
          path: |
            Cargo.lock
            t039-metadata.json
          if-no-files-found: error
