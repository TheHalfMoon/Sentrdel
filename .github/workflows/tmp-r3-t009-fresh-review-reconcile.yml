name: Temporary R3 T009 Fresh Review Reconciliation

on:
  push:
    branches:
      - feat/r3-t009-bounded-route-extraction
    paths:
      - .github/workflows/tmp-r3-t009-fresh-review-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/r3-t009-bounded-route-extraction
          fetch-depth: 0
          persist-credentials: true

      - name: Guard against concurrent feature-head movement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/r3-t009-bounded-route-extraction
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/r3-t009-bounded-route-extraction)"

      - name: Apply bounded five-finding reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          route_path = Path("crates/sentrdel-review/src/business_logic/route.rs")
          route = route_path.read_text()

          old = '''        let mut cursor = skip_mask_ws(mask, receiver_end);
          if mask.get(cursor) == Some(&b'[')
'''
          new = '''        let mut cursor = skip_mask_ws(mask, receiver_end);
          if mask.get(cursor) == Some(&b'?') && mask.get(cursor + 1) == Some(&b'.') {
              let registration_start = skip_mask_ws(mask, cursor + 2);
              if let Some(registration_end) = parse_ident_end_if_any(mask, registration_start) {
                  let registration = &source[registration_start..registration_end];
                  let call_start = skip_mask_ws(mask, registration_end);
                  if (parse_express_http_method(registration).is_some()
                      || matches!(registration, "all" | "use" | "param" | "route"))
                      && mask.get(call_start) == Some(&b'(')
                      && let Some(call_end) = find_balanced(mask, call_start, b'(', b')')
                  {
                      builder.gap(
                          RouteCoverageGapReason::DynamicRegistration,
                          receiver_start,
                          call_end + 1,
                      )?;
                      index = call_end + 1;
                      continue;
                  }
              }
          }
          if mask.get(cursor) == Some(&b'[')
'''
          if route.count(old) != 1:
              raise SystemExit("expected one Express cursor anchor")
          route = route.replace(old, new, 1)

          old = '''        if registration == "use" && mask.get(after_registration) == Some(&b'(') {
'''
          new = '''        if matches!(registration, "use" | "param")
              && mask.get(after_registration) == Some(&b'(')
          {
'''
          if route.count(old) != 1:
              raise SystemExit("expected one Express use branch")
          route = route.replace(old, new, 1)

          old = '''        builder.route(
              method,
              "method-path-callback-chain",
              &route_pattern,
              &handler_key,
              &callback_keys,
              receiver_start,
              call_end + 1,
              if partial {
                  CoverageState::Partial
              } else {
                  CoverageState::Covered
              },
          )?;
          index = call_end + 1;
'''
          new = '''        builder.route(
              method,
              "method-path-callback-chain",
              &route_pattern,
              &handler_key,
              &callback_keys,
              receiver_start,
              call_end + 1,
              if partial {
                  CoverageState::Partial
              } else {
                  CoverageState::Covered
              },
          )?;
          let suffix_dot = skip_mask_ws(mask, call_end + 1);
          if mask.get(suffix_dot) == Some(&b'.') {
              let suffix_start = skip_mask_ws(mask, suffix_dot + 1);
              if let Some(suffix_end) = parse_ident_end_if_any(mask, suffix_start) {
                  let suffix = &source[suffix_start..suffix_end];
                  let suffix_call_start = skip_mask_ws(mask, suffix_end);
                  if (parse_express_http_method(suffix).is_some()
                      || matches!(suffix, "all" | "use" | "param" | "route"))
                      && mask.get(suffix_call_start) == Some(&b'(')
                      && let Some(suffix_call_end) =
                          find_balanced(mask, suffix_call_start, b'(', b')')
                  {
                      builder.gap(
                          RouteCoverageGapReason::DynamicRegistration,
                          suffix_dot,
                          suffix_call_end + 1,
                      )?;
                      index = suffix_call_end + 1;
                      continue;
                  }
              }
          }
          index = call_end + 1;
'''
          if route.count(old) != 1:
              raise SystemExit("expected one Express route emission anchor")
          route = route.replace(old, new, 1)

          old = '''                    let mut rhs = skip_mask_ws(mask, name_end);
                      if mask.get(rhs) == Some(&b'=') {
                          rhs = skip_mask_ws(mask, rhs + 1);
                          if looks_like_function_value(mask, rhs) {
'''
          new = '''                    let mut rhs = skip_mask_ws(mask, name_end);
                      if mask.get(rhs) == Some(&b':') {
                          builder.gap(
                              RouteCoverageGapReason::UnsupportedHandlerExport,
                              export_start,
                              name_end,
                          )?;
                      } else if mask.get(rhs) == Some(&b'=') {
                          rhs = skip_mask_ws(mask, rhs + 1);
                          if looks_like_function_value(mask, rhs) {
'''
          if route.count(old) != 1:
              raise SystemExit("expected one Next const RHS anchor")
          route = route.replace(old, new, 1)

          old = '''        | "import_specifier"
              | "namespace_import"
'''
          new = '''        | "import_specifier"
              | "import_clause"
              | "namespace_import"
'''
          if route.count(old) != 1:
              raise SystemExit("expected one Deno import binding anchor")
          route = route.replace(old, new, 1)
          route_path.write_text(route)

          tests_path = Path("crates/sentrdel-review/tests/r3_t009_route_extraction.rs")
          tests = tests_path.read_text()
          anchor = '''#[test]
          fn malformed_source_fails_closed_through_fixed_grammar_boundary() {
'''
          additions = r'''#[test]
          fn express_param_registration_is_explicit_unsupported_middleware() {
              let source = b"router.param('id', authorize);\nrouter.get('/users/:id', handler);\n";
              let result = extract_routes(
                  RouteAdapter::Express,
                  StructuralLanguage::JavaScript,
                  &path("src/routes.js"),
                  source,
                  BusinessLogicLimits::default(),
              )
              .expect("classify Express parameter middleware");

              assert_eq!(result.routes().len(), 1);
              assert_eq!(result.routes()[0].route_pattern(), "/users/:id");
              assert!(result.gaps().iter().any(|gap| {
                  gap.reason() == RouteCoverageGapReason::UnsupportedMiddleware
              }));
          }

          #[test]
          fn express_optional_chain_direct_registration_is_dynamic_gap() {
              let result = extract_routes(
                  RouteAdapter::Express,
                  StructuralLanguage::JavaScript,
                  &path("src/routes.js"),
                  b"app?.get('/admin', handler);\n",
                  BusinessLogicLimits::default(),
              )
              .expect("classify optional-chained Express registration");

              assert!(result.routes().is_empty());
              assert!(result.gaps().iter().any(|gap| {
                  gap.reason() == RouteCoverageGapReason::DynamicRegistration
              }));
          }

          #[test]
          fn express_fluent_suffix_is_visible_as_dynamic_registration_gap() {
              let result = extract_routes(
                  RouteAdapter::Express,
                  StructuralLanguage::JavaScript,
                  &path("src/routes.js"),
                  b"app.get('/a', first).post('/b', second);\n",
                  BusinessLogicLimits::default(),
              )
              .expect("keep fluent Express suffix visible");

              assert_eq!(result.routes().len(), 1);
              assert_eq!(result.routes()[0].route_pattern(), "/a");
              assert!(result.gaps().iter().any(|gap| {
                  gap.reason() == RouteCoverageGapReason::DynamicRegistration
              }));
          }

          #[test]
          fn next_app_typed_method_export_is_an_explicit_gap() {
              let source = b"export function GET() { return new Response('ok'); }\nexport const POST: RouteHandler = async () => new Response('created');\n";
              let result = extract_routes(
                  RouteAdapter::NextApp,
                  StructuralLanguage::TypeScript,
                  &path("app/api/typed/route.ts"),
                  source,
                  BusinessLogicLimits::default(),
              )
              .expect("keep typed Next method export visible");

              assert_eq!(result.routes().len(), 1);
              assert_eq!(result.routes()[0].method(), HttpMethod::Get);
              assert!(result.gaps().iter().any(|gap| {
                  gap.reason() == RouteCoverageGapReason::UnsupportedHandlerExport
              }));
          }

          #[test]
          fn default_imported_deno_binding_is_an_ambiguous_receiver_gap() {
              let source = b"import Deno from './mock-runtime';\nDeno.serve(handler);\n";
              let result = extract_routes(
                  RouteAdapter::SupabaseEdge,
                  StructuralLanguage::TypeScript,
                  &path("supabase/functions/private-doc/index.ts"),
                  source,
                  BusinessLogicLimits::default(),
              )
              .expect("classify default-imported Deno binding");

              assert!(result.routes().is_empty());
              assert!(result.gaps().iter().any(|gap| {
                  gap.reason() == RouteCoverageGapReason::AmbiguousReceiverBinding
              }));
          }

          '''
          if tests.count(anchor) != 1:
              raise SystemExit("expected one T009 malformed-test anchor")
          tests = tests.replace(anchor, additions + anchor, 1)
          tests_path.write_text(tests)
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all

      - name: Run sentrdel-review library tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test -p sentrdel-review --lib

      - name: Run focused T009 regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test -p sentrdel-review --test r3_t009_route_extraction

      - name: Run focused Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy -p sentrdel-review --all-targets -- -D warnings

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-r3-t009-fresh-review-reconcile.yml

      - name: Guard final diff and push product-only repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/r3-t009-bounded-route-extraction
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/r3-t009-bounded-route-extraction)"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            ".github/workflows/tmp-r3-t009-fresh-review-reconcile.yml"
            "crates/sentrdel-review/src/business_logic/route.rs"
            "crates/sentrdel-review/tests/r3_t009_route_extraction.rs"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[*]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(r3): surface remaining route extraction gaps"
          git push origin HEAD:feat/r3-t009-bounded-route-extraction
