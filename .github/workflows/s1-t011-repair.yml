name: S1 T011 Repair Qualification

on:
  push:
    branches:
      - evidence/s1-t011-repair-e47b41e

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Freeze exact reviewed head and payload
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/s1_t011_repair.py /tmp/s1_t011_repair.py
          git fetch origin feat/s1-t011-bilateral-support
          test "$(git rev-parse origin/feat/s1-t011-bilateral-support)" = "e47b41ed18053467dec746108f41263edf3876ea"
          git checkout --detach e47b41ed18053467dec746108f41263edf3876ea
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version
      - name: Apply exact review repair
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/s1_t011_repair.py
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only)" = "crates/sentrdel-review/src/regression/support.rs"
      - name: Qualify repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --locked
          cargo test -p sentrdel-review --lib regression::support --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit and advance feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e47b41ed18053467dec746108f41263edf3876ea"
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add crates/sentrdel-review/src/regression/support.rs
          git commit -m "fix(s1): enforce provenance text limits"
          test "$(git rev-parse HEAD^)" = "e47b41ed18053467dec746108f41263edf3876ea"
          test "$(git diff --name-only HEAD^ HEAD)" = "crates/sentrdel-review/src/regression/support.rs"
          git push origin HEAD:refs/heads/feat/s1-t011-bilateral-support
