name: T055 Lockfile Fix

on:
  push:
    branches:
      - impl/001-t055-guard-mcp-cli

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t055-guard-mcp-cli
      - name: Add internal guard dependency to sentrdel-cli lock entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.lock')
          text = path.read_text(encoding='utf-8')
          old = '''name = "sentrdel-cli"\nversion = "0.0.0"\ndependencies = [\n "sentrdel-engine",\n "sentrdel-graph",\n "sentrdel-policy",'''
          new = '''name = "sentrdel-cli"\nversion = "0.0.0"\ndependencies = [\n "sentrdel-engine",\n "sentrdel-graph",\n "sentrdel-guard",\n "sentrdel-policy",'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one canonical sentrdel-cli lock entry')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/t055-lock-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build(cli): lock internal guard dependency'
          git push origin HEAD:impl/001-t055-guard-mcp-cli
