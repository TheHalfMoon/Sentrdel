name: T064 Rustfmt

on:
  push:
    branches:
      - impl/001-t064-project-profile-coverage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t064-project-profile-coverage
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply rustfmt
        run: cargo +1.98.0 fmt --all
      - name: Commit formatted sources and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt for T064"
          fi
          git rm .github/workflows/t064-rustfmt.yml
          git commit -m "ci(temp): remove T064 rustfmt workflow"
          git push origin HEAD:impl/001-t064-project-profile-coverage
