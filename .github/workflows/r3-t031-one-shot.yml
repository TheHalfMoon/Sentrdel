name: R3-T031 One-Shot Qualification

on:
  push:
    branches:
      - test/r3-t031-release-benchmark

permissions:
  contents: write

jobs:
  qualify-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/r3-t031-release-benchmark
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Format candidate
        run: cargo +1.98.0 fmt --all

      - name: Run focused R3-T031 release benchmark
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t031_release_benchmark --locked

      - name: Check workspace
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Require clean patch shape
        run: git diff --check

      - name: Remove temporary workflow and commit formatting only
        shell: bash
        run: |
          rm .github/workflows/r3-t031-one-shot.yml
          git add crates/sentrdel-review/tests/r3_t031_release_benchmark.rs tests/benchmark/r3-release-suite.json .github/workflows/r3-t031-one-shot.yml
          if git diff --cached --quiet; then
            echo "No formatting delta; temporary workflow removal is the only staged change."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(r3): qualify and format T031 release benchmark"
          git push origin HEAD:test/r3-t031-release-benchmark
