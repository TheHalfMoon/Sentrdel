name: Temporary R3-T027 rustfmt

on:
  push:
    branches:
      - feat/r3-t027-review-integration-v2

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t027-review-integration-v2
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply canonical rustfmt
        run: cargo +1.98.0 fmt --all
      - name: Commit formatted T027 sources only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-cli/src/review.rs crates/sentrdel-cli/src/review/business_logic.rs
          if git diff --cached --quiet; then
            echo "No rustfmt changes required"
            exit 0
          fi
          git commit -m "style(r3): apply rustfmt to review integration"
          git push origin HEAD:feat/r3-t027-review-integration-v2
