name: Temporary R3-T032 Rustfmt

on:
  push:
    branches:
      - probe/r3-t032-rustfmt-1a57b11

permissions:
  contents: write

jobs:
  rustfmt:
    name: format R3-T032 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: probe/r3-t032-rustfmt-1a57b11

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +1.98.0 fmt --all

      - name: Require bounded formatting delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'changed=%s\n' "${changed[*]:-}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/sentrdel-review/tests/r3_t032_latency_resource_benchmark.rs"
          cargo +1.98.0 fmt --all -- --check

      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-review/tests/r3_t032_latency_resource_benchmark.rs
          git commit -m 'chore(r3): rustfmt T032 qualification'
          git push origin HEAD:probe/r3-t032-rustfmt-1a57b11
