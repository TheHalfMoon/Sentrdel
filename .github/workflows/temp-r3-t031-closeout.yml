name: Temporary R3-T031 Ledger Closeout

on:
  push:
    branches:
      - chore/r3-t031-ledger-closeout

permissions:
  contents: write

jobs:
  closeout:
    name: close R3-T031 ledger only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Require exact canonical parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d192697179460cc1bf8063509b17311df1925209"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/temp-r3-t031-closeout.yml"

      - name: Toggle only R3-T031
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("specs/003-business-logic-invariants/tasks.md")
          text = path.read_text()
          old = "- [ ] **R3-T031** Run/promote the initial release-gating R3 invariant set through SentrdelBench: active clean-case FP threshold, declared-scope known-miss/recall gate, deterministic replay, explicit coverage/provenance, authority assertions, protected-holdout rules where applicable and cross-layer explanation correctness."
          new = old.replace("- [ ]", "- [x]", 1)
          if text.count(old) != 1:
              raise SystemExit("R3-T031 unchecked source line is not unique")
          text = text.replace(old, new, 1)
          if "- [ ] **R3-T032**" not in text:
              raise SystemExit("R3-T032 must remain unchecked")
          path.write_text(text)
          PY
          git diff --check

      - name: Remove helper and require one-file net delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-r3-t031-closeout.yml
          mapfile -t changed < <(git diff --name-only d192697179460cc1bf8063509b17311df1925209)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "specs/003-business-logic-invariants/tasks.md"
          test "$(git diff --numstat d192697179460cc1bf8063509b17311df1925209 -- specs/003-business-logic-invariants/tasks.md)" = $'1\t1\tspecs/003-business-logic-invariants/tasks.md'

      - name: Commit bounded closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(r3): close R3-T031 task ledger"
          git push origin HEAD:chore/r3-t031-ledger-closeout
