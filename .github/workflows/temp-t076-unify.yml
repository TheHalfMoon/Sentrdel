name: Temporary T076 Wiring Unification

on:
  push:
    branches:
      - impl/001-t076-reason-network-wiring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Unify flag authority and export orchestration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          review = Path('crates/sentrdel-cli/src/review_reasoning.rs')
          text = review.read_text(encoding='utf-8')
          import_marker = 'use sentrdel_review::reasoner::{Reasoner, ReasonerRequest, reason_to_evidence};\n'
          if text.count(import_marker) != 1:
              raise SystemExit('review reasoner import marker not found exactly once')
          text = text.replace(import_marker, 'use crate::reasoning::ReviewReasoningFlags;\n' + import_marker)
          duplicate = '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub struct ReviewReasoningFlags {\n    pub reason: bool,\n    pub no_network: bool,\n}\n\n'''
          if text.count(duplicate) != 1:
              raise SystemExit('duplicate ReviewReasoningFlags block not found exactly once')
          review.write_text(text.replace(duplicate, ''), encoding='utf-8')

          lib = Path('crates/sentrdel-cli/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          marker = 'pub mod reasoning;\npub mod review;\n'
          if text.count(marker) != 1:
              raise SystemExit('CLI module export marker not found exactly once')
          lib.write_text(text.replace(marker, 'pub mod reasoning;\npub mod review;\npub mod review_reasoning;\n'), encoding='utf-8')
          PY
          rm .github/workflows/temp-t076-unify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/lib.rs crates/sentrdel-cli/src/review_reasoning.rs .github/workflows/temp-t076-unify.yml
          git commit -m 'refactor(cli): unify T076 reasoning orchestration'
          git push origin HEAD:impl/001-t076-reason-network-wiring
