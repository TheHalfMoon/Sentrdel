name: T070 Closeout

on:
  push:
    branches:
      - closeout/001-t070-explain-authority-contracts

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t070-explain-authority-contracts
          fetch-depth: 1

      - name: Mark T070 complete and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] T070 [US4] Add golden/contract tests proving explanation cannot mutate canonical severity/proof/workflow state.'
          new = '- [x] T070 [US4] Add golden/contract tests proving explanation cannot mutate canonical severity/proof/workflow state.'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one T070 open checkbox, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): close T070 explain authority task'
          git rm .github/workflows/t070-closeout.yml
          git commit -m 'ci(temp): remove T070 closeout workflow'
          git push origin HEAD:closeout/001-t070-explain-authority-contracts
