name: TEMP S1 T007 contract bridge

on:
  push:
    branches:
      - temp/s1-t007-contract-bridge

permissions:
  contents: write

jobs:
  bridge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temporary repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Apply exact contract bridge patch
        run: python3 tmp_s1_t007_bridge.py

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format patched sources
        run: cargo +1.98.0 fmt --all

      - name: Verify formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check workspace
        run: cargo +1.98.0 check --workspace --locked

      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked

      - name: Clippy workspace
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify patch scope and commit product files only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/sentrdel-review/src/regression/model.rs \
            crates/sentrdel-review/src/regression/revision.rs \
            crates/sentrdel-review/tests/s1_revision_validation.rs
          git diff --cached --quiet && { echo "no product patch produced"; exit 1; }
          git commit -m "fix(s1): bridge validated revisions to pair contract [skip ci]"
          git push origin HEAD:temp/s1-t007-contract-bridge
