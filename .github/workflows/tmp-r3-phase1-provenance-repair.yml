name: Temporary R3 Phase1 Provenance Repair

on:
  push:
    branches:
      - feat/r3-phase1-contracts-ground-truth

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-phase1-contracts-ground-truth
          fetch-depth: 0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Enforce non-empty semantic provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/sentrdel-review/src/business_logic/model.rs')
          text = path.read_text()

          replacements = [
              (
                  '    EmptyContentDigest,\n    ContentDigestTooLarge {',
                  '    EmptyContentDigest,\n    EmptyProvenance,\n    ContentDigestTooLarge {',
              ),
              (
                  '            Self::EmptyContentDigest => {\n                formatter.write_str("source content digest must not be empty")\n            }\n            Self::ContentDigestTooLarge { bytes, max } => write!(',
                  '            Self::EmptyContentDigest => {\n                formatter.write_str("source content digest must not be empty")\n            }\n            Self::EmptyProvenance => {\n                formatter.write_str("semantic record requires explicit source provenance")\n            }\n            Self::ContentDigestTooLarge { bytes, max } => write!(',
              ),
              (
                  'fn normalize_provenance(\n    mut values: Vec<SourceLocation>,\n    limits: BusinessLogicLimits,\n) -> Result<Vec<SourceLocation>, ModelError> {\n    validate_provenance_count(values.len(), limits)?;\n    values.sort();',
                  'fn normalize_provenance(\n    mut values: Vec<SourceLocation>,\n    limits: BusinessLogicLimits,\n) -> Result<Vec<SourceLocation>, ModelError> {\n    let limits = limits.validate()?;\n    if values.is_empty() {\n        return Err(ModelError::EmptyProvenance);\n    }\n    validate_provenance_count(values.len(), limits)?;\n    values.sort();',
              ),
              (
                  '            InvariantRequirement::RequiredRole {\n                required_roles: vec!["z".to_owned(), "admin".to_owned(), "z".to_owned()],\n            },\n            Vec::new(),\n            limits,\n        )\n        .unwrap();',
                  '            InvariantRequirement::RequiredRole {\n                required_roles: vec!["z".to_owned(), "admin".to_owned(), "z".to_owned()],\n            },\n            vec![source("src/invariants.rs", 1)],\n            limits,\n        )\n        .unwrap();',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          marker = '''    #[test]\n    fn derivation_caps_are_enforced_at_construction() {'''
          regression = '''    #[test]\n    fn semantic_record_construction_rejects_empty_provenance() {\n        let limits = BusinessLogicLimits::default();\n        assert!(matches!(\n            RouteObservation::new(\n                id("r3.route", "missing-provenance"),\n                FrameworkFamily::Express,\n                HttpMethod::Get,\n                "/accounts/:id",\n                None,\n                Vec::new(),\n                Vec::new(),\n                CoverageState::Partial,\n                limits,\n            ),\n            Err(ModelError::EmptyProvenance)\n        ));\n\n        assert!(matches!(\n            InvariantEvaluation::new(\n                id("r3.evaluation", "missing-provenance"),\n                id("r3.invariant", "tenant-binding"),\n                None,\n                InvariantEvaluationState::Unknown,\n                Vec::new(),\n                Vec::new(),\n                vec!["missing-link".to_owned()],\n                Vec::new(),\n                limits,\n            ),\n            Err(ModelError::EmptyProvenance)\n        ));\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('could not locate provenance regression insertion point')
          text = text.replace(marker, regression + marker, 1)

          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all

      - name: Test provenance and Phase1 contracts
        run: |
          cargo +1.98.0 test -p sentrdel-review --lib business_logic::model::tests --locked
          cargo +1.98.0 test -p sentrdel-review --test r3_phase1_contract --locked
          cargo +1.98.0 check -p sentrdel-review --all-targets --locked

      - name: Commit qualified repair output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review/src/business_logic/model.rs
          git diff --cached --quiet && { echo "Expected provenance repair produced no diff."; exit 1; }
          git commit -m "fix(r3): require semantic source provenance"
          git push origin HEAD:feat/r3-phase1-contracts-ground-truth
