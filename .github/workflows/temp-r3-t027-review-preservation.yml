name: Temporary R3-T027 review preservation test

on:
  push:
    branches:
      - feat/r3-t027-review-integration-v2

permissions:
  contents: write

jobs:
  add-regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t027-review-integration-v2
          fetch-depth: 1
      - name: Add authority preservation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('crates/sentrdel-cli/src/review/business_logic.rs')
          text = path.read_text()
          marker = '    /// Public ReviewOutput integration retains Evidence and appends Coverage only.\n    #[test]\n    fn public_review_surface_integrates_r3_without_minting_findings_or_decision() {\n'
          encoded = ''
          test = base64.b64decode(encoded).decode('utf-8')
          if marker not in text:
              raise SystemExit('T027 insertion marker not found')
          path.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Format and run focused regression
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p sentrdel-cli integration_preserves_existing_findings_and_coverage_verbatim --locked
      - name: Commit regression only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-cli/src/review/business_logic.rs
          git commit -m "test(r3): preserve prior review authority during integration"
          git push origin HEAD:feat/r3-t027-review-integration-v2
