name: Postmerge Governance Proof

on:
  push:
    branches:
      - evidence/postmerge-governance-255

permissions:
  contents: read

jobs:
  repository-governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Verify protected repository governance
        shell: bash
        env:
          DEDICATED_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DEDICATED_TOKEN}" ]]; then
            echo "dedicated governance verifier credential is unavailable" >&2
            exit 1
          fi
          echo "::add-mask::${DEDICATED_TOKEN}"
          unset GITHUB_TOKEN
          export GH_TOKEN="${DEDICATED_TOKEN}"
          python3 scripts/verify_repository_governance.py
