name: T039 Temporary Closeout

on:
  push:
    branches:
      - closeout/001-t039-native-structural-framework

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update only T039 and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def get(path):
              quoted = urllib.parse.quote(path, safe='/')
              url = f'https://api.github.com/repos/{repo}/contents/{quoted}?ref={urllib.parse.quote(branch, safe="")}'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)

          def put(path, sha, content, message):
              quoted = urllib.parse.quote(path, safe='/')
              payload = json.dumps({
                  'message': message,
                  'content': base64.b64encode(content.encode()).decode(),
                  'sha': sha,
                  'branch': branch,
              }).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/contents/{quoted}',
                  data=payload,
                  method='PUT',
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          tasks_path = 'specs/001-v0-1-evidence-guard-foundation/tasks.md'
          tasks = get(tasks_path)
          text = base64.b64decode(tasks['content']).decode()
          old = '- [ ] T039 [P] [US1] Integrate tree-sitter/`ast-grep-core` native producer framework and Sentrdel-owned rule format.'
          new = '- [x] T039 [P] [US1] Integrate tree-sitter/`ast-grep-core` native producer framework and Sentrdel-owned rule format.'
          if text.count(old) != 1:
              raise SystemExit('T039 unchecked line not found exactly once')
          put(tasks_path, tasks['sha'], text.replace(old, new, 1), 'docs(spec): close T039 structural framework task')

          workflow_path = '.github/workflows/t039-closeout.yml'
          workflow = get(workflow_path)
          quoted = urllib.parse.quote(workflow_path, safe='/')
          payload = json.dumps({
              'message': 'ci(temp): remove T039 closeout workflow',
              'sha': workflow['sha'],
              'branch': branch,
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{quoted}',
              data=payload,
              method='DELETE',
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              json.load(response)
          PY
