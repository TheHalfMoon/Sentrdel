name: Temporary R3-T030 admitted-link repair

on:
  push:
    branches:
      - test/r3-t030-e2e-fixtures

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/r3-t030-e2e-fixtures
          persist-credentials: true
          fetch-depth: 1
      - name: Align admitted links with canonical T021 contracts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/sentrdel-cli/src/r3_t030_e2e.rs')
          text = path.read_text()
          old = '''    let actor = admitted_actor(case);
              let value = admitted_value(case, &actor);
              let operation = admitted_operation(case, &value);
              let mut links = vec![admitted_link(
                  case,
                  route.route_id().clone(),
                  actor.actor_id().clone(),
                  "surface_route_reaches_actor",
                  160,
              )];
              if case == FixtureCase::Vulnerable {
                  links.push(admitted_link(
                      case,
                      actor.actor_id().clone(),
                      operation.operation_id().clone(),
                      "surface_actor_reaches_operation",
                      180,
                  ));
              }
          '''
          new = '''    let actor = admitted_actor(case);
              let value = admitted_value(case, &actor);
              let operation = admitted_operation(case, &value);
              let callback = route
                  .callback_chain()
                  .last()
                  .expect("supported surface callback")
                  .clone();
              let mut links = vec![admitted_link(
                  case,
                  callback,
                  actor.actor_id().clone(),
                  "surface_callback_reaches_actor",
                  160,
              )];
              if case == FixtureCase::Vulnerable {
                  links.push(admitted_link(
                      case,
                      actor.actor_id().clone(),
                      value.value_id().clone(),
                      "unrelated_request_value",
                      180,
                  ));
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('current admitted links anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p sentrdel-cli --bin sentrdel r3_t030_e2e --locked
          cargo +1.98.0 check --workspace --all-targets --locked
          git diff --check
          rm .github/workflows/temp-r3-t030-admitted-link-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/r3_t030_e2e.rs .github/workflows/temp-r3-t030-admitted-link-repair.yml
          git commit -m 'test(r3): align T030 admitted semantic links'
          git push origin HEAD:test/r3-t030-e2e-fixtures
