name: Self Security

on:
  pull_request:
  push:
    branches:
      - main
      - 'impl/**'

permissions:
  contents: read

jobs:
  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install checksum-pinned self-security tools
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_ROOT="$RUNNER_TEMP/sentrdel-self-security"
          DOWNLOADS="$TOOLS_ROOT/downloads"
          BIN_DIR="$TOOLS_ROOT/bin"
          mkdir -p "$DOWNLOADS" "$BIN_DIR" "$TOOLS_ROOT/audit" "$TOOLS_ROOT/deny"

          AUDIT_ARCHIVE="$DOWNLOADS/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          DENY_ARCHIVE="$DOWNLOADS/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$AUDIT_ARCHIVE" \
            'https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz'
          printf '%s  %s\n' \
            '7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428' \
            "$AUDIT_ARCHIVE" | sha256sum --check --strict -

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$DENY_ARCHIVE" \
            'https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz'
          printf '%s  %s\n' \
            '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f' \
            "$DENY_ARCHIVE" | sha256sum --check --strict -

          tar -xzf "$AUDIT_ARCHIVE" -C "$TOOLS_ROOT/audit"
          tar -xzf "$DENY_ARCHIVE" -C "$TOOLS_ROOT/deny"

          mapfile -t AUDIT_BINARIES < <(find "$TOOLS_ROOT/audit" -type f -name cargo-audit -print)
          mapfile -t DENY_BINARIES < <(find "$TOOLS_ROOT/deny" -type f -name cargo-deny -print)
          test "${#AUDIT_BINARIES[@]}" -eq 1
          test "${#DENY_BINARIES[@]}" -eq 1

          install -m 0755 "${AUDIT_BINARIES[0]}" "$BIN_DIR/cargo-audit"
          install -m 0755 "${DENY_BINARIES[0]}" "$BIN_DIR/cargo-deny"
          printf '%s\n' "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Verify self-security tool identities
        run: |
          set -euo pipefail
          test "$(cargo-audit --version)" = 'cargo-audit 0.22.2'
          test "$(cargo-deny --version)" = 'cargo-deny 0.20.2'

      - name: Generate locked Sentrdel dependency metadata
        run: cargo +1.98.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/sentrdel-metadata.json"

      - name: Validate source qualification and privileged declarations
        run: python3 scripts/validate_dependency_governance.py --metadata "$RUNNER_TEMP/sentrdel-metadata.json"

      - name: Audit Sentrdel lockfile advisories
        run: cargo +1.98.0 audit --file Cargo.lock

      - name: Enforce Sentrdel dependency policy
        run: cargo +1.98.0 deny check advisories bans licenses sources
