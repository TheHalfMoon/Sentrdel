name: T084 Closeout

on:
  push:
    branches:
      - closeout/001-t084-architecture-evidence-asel

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t084-architecture-evidence-asel
          persist-credentials: true
          fetch-depth: 1
      - name: Mark T084 complete and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T084 [P] Document architecture/Evidence/ASEL including trusted-head limitations, stdio MCP scope, evaluation-plane limits, and candidate-only future learning authority.'
          new = old.replace('- [ ]', '- [x]', 1)
          if text.count(old) != 1:
              raise SystemExit('T084 open checkbox not found exactly once; refusing edit')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/t084-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md .github/workflows/t084-closeout.yml
          git commit -m 'docs(spec): close T084 architecture task'
          git push origin HEAD:closeout/001-t084-architecture-evidence-asel
