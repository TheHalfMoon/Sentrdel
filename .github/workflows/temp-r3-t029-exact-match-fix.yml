name: Temporary R3-T029 exact-match repair

on:
  push:
    branches:
      - feat/r3-t029-explain-business-logic

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t029-explain-business-logic
          persist-credentials: true
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Apply exact context-specific invariant matching repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/sentrdel-cli/src/explain_business_logic.rs')
          text = path.read_text()

          old_global = '''        let has_invariant_subject = affected.iter().any(|subject| {
            subject.starts_with("invariant:") || subject.starts_with("invariant_evaluation:")
        });

'''
          if text.count(old_global) != 1:
              raise SystemExit(f'expected one global prefix matcher, found {text.count(old_global)}')
          text = text.replace(old_global, '', 1)

          old_path = '''            let path_subject = format!("cross_layer_path:{}", context.path_id);
            let path_matches = affected.contains(path_subject.as_str());

            let mut invariants = Vec::new();
'''
          new_path = '''            let path_subject = format!("cross_layer_path:{}", context.path_id);
            let path_matches = affected.contains(path_subject.as_str());
            let has_matching_invariant_subject = context.invariants.iter().any(|invariant| {
                let invariant_subject = format!("invariant:{}", invariant.invariant_id);
                let evaluation_subject =
                    format!("invariant_evaluation:{}", invariant.evaluation_id);
                affected.contains(invariant_subject.as_str())
                    || affected.contains(evaluation_subject.as_str())
            });

            let mut invariants = Vec::new();
'''
          if text.count(old_path) != 1:
              raise SystemExit(f'expected one path matching block, found {text.count(old_path)}')
          text = text.replace(old_path, new_path, 1)

          old_condition = '                if invariant_matches || (path_matches && !has_invariant_subject) {'
          new_condition = '                if invariant_matches || (path_matches && !has_matching_invariant_subject) {'
          if text.count(old_condition) != 1:
              raise SystemExit(f'expected one invariant fallback condition, found {text.count(old_condition)}')
          text = text.replace(old_condition, new_condition, 1)

          old_skip = '            if path_matches && has_invariant_subject && invariants.is_empty() {'
          new_skip = '            if path_matches && has_matching_invariant_subject && invariants.is_empty() {'
          if text.count(old_skip) != 1:
              raise SystemExit(f'expected one path skip condition, found {text.count(old_skip)}')
          text = text.replace(old_skip, new_skip, 1)

          anchor = '''    #[test]
    fn exact_invariant_subject_can_select_one_invariant_without_path_subject() {
'''
          regression = '''    #[test]
    fn exact_path_match_is_not_suppressed_by_unrelated_invariant_subject() {
        let output = output(vec![
            "cross_layer_path:path:update".to_owned(),
            "invariant:invariant:unrelated".to_owned(),
            "invariant_evaluation:eval:unrelated".to_owned(),
        ]);
        let contexts = vec![context("path:update", InvariantEvaluationState::Violated)];
        let explanation = BusinessLogicExplainContext::from_output(&output, &contexts)
            .unwrap()
            .expect("exact path match must retain its bounded chain");

        assert_eq!(explanation.chains().len(), 1);
        assert_eq!(explanation.chains()[0].path_id, "path:update");
        assert_eq!(explanation.chains()[0].invariants.len(), 1);
        assert_eq!(
            explanation.chains()[0].invariants[0].invariant_id,
            "invariant:tenant-binding"
        );
    }

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one invariant-selection test anchor, found {text.count(anchor)}')
          text = text.replace(anchor, regression + anchor, 1)

          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "${changed}" | grep -vFx 'crates/sentrdel-cli/src/explain_business_logic.rs' || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'unexpected repair paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/explain_business_logic.rs
          git commit -m 'fix(r3): preserve exact path explanation context'
          git push origin HEAD:feat/r3-t029-explain-business-logic
