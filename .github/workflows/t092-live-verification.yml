name: T092 Live Verification

on:
  push:
    branches:
      - verify/t092-live-20260829-0919

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify repository governance read-only
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          SENTRDEL_GOVERNANCE_FALLBACK_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN
          if [ -n "${SENTRDEL_GOVERNANCE_ADMIN_TOKEN:-}" ]; then
            export GH_TOKEN="$SENTRDEL_GOVERNANCE_ADMIN_TOKEN"
          elif [ -n "${SENTRDEL_GOVERNANCE_FALLBACK_TOKEN:-}" ]; then
            export GH_TOKEN="$SENTRDEL_GOVERNANCE_FALLBACK_TOKEN"
          else
            echo "repository-governance: NO_BOUNDED_CREDENTIAL"
            exit 78
          fi
          unset SENTRDEL_GOVERNANCE_ADMIN_TOKEN
          unset SENTRDEL_GOVERNANCE_FALLBACK_TOKEN
          python3 scripts/verify_repository_governance.py
