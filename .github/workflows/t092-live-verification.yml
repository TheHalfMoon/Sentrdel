name: T092 Live Verification

on:
  push:
    branches:
      - verify/t092-live-20260829-0206

permissions:
  contents: read

jobs:
  verify:
    name: Verify live repository governance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify protected main policy
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          GH_TOKEN_BOUNDED: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SENTRDEL_GOVERNANCE_ADMIN_TOKEN:-}" ]]; then
            export GITHUB_TOKEN="$SENTRDEL_GOVERNANCE_ADMIN_TOKEN"
          elif [[ -n "${GH_TOKEN_BOUNDED:-}" ]]; then
            export GITHUB_TOKEN="$GH_TOKEN_BOUNDED"
          else
            echo "repository-governance: NO_BOUNDED_CREDENTIAL"
            exit 2
          fi
          unset SENTRDEL_GOVERNANCE_ADMIN_TOKEN GH_TOKEN_BOUNDED
          python3 scripts/verify_repository_governance.py
