name: T092 Live Verification

on:
  push:
    branches:
      - verify/t092-live-20260829-0756

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      SENTRDEL_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
      FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run read-only canonical governance verifier
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN
          if [ -n "${SENTRDEL_ADMIN_TOKEN:-}" ]; then
            export GH_TOKEN="$SENTRDEL_ADMIN_TOKEN"
          elif [ -n "${FALLBACK_GH_TOKEN:-}" ]; then
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
          else
            echo "No authorized governance verification credential is configured." >&2
            exit 2
          fi
          python3 scripts/verify_repository_governance.py
          unset GH_TOKEN
