name: Temporary R3 Empty Requirement Repair

on:
  push:
    branches:
      - feat/r3-phase1-contracts-ground-truth

permissions:
  contents: write

jobs:
  repair-test-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-phase1-contracts-ground-truth
          fetch-depth: 0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Repair empty invariant requirement admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/sentrdel-review/src/business_logic/model.rs')
          text = path.read_text()

          replacements = [
              (
                  '    EmptyProvenance,\n    ContentDigestTooLarge {',
                  "    EmptyProvenance,\n    EmptyRequiredCollection(&'static str),\n    ContentDigestTooLarge {",
              ),
              (
                  '            Self::EmptyProvenance => {\n                formatter.write_str("semantic record requires explicit source provenance")\n            }\n            Self::ContentDigestTooLarge { bytes, max } => write!(',
                  '            Self::EmptyProvenance => {\n                formatter.write_str("semantic record requires explicit source provenance")\n            }\n            Self::EmptyRequiredCollection(field) => {\n                write!(formatter, "required business-logic collection {field} must not be empty")\n            }\n            Self::ContentDigestTooLarge { bytes, max } => write!(',
              ),
              (
                  '        InvariantRequirement::RequiredRole { required_roles } => {\n            Ok(InvariantRequirement::RequiredRole {\n                required_roles: normalize_bounded_strings(\n                    required_roles,\n                    "required_roles",\n                    limits,\n                )?,\n            })\n        }',
                  '        InvariantRequirement::RequiredRole { required_roles } => {\n            let required_roles = normalize_bounded_strings(\n                required_roles,\n                "required_roles",\n                limits,\n            )?;\n            require_non_empty_collection("required_roles", required_roles.len())?;\n            Ok(InvariantRequirement::RequiredRole { required_roles })\n        }',
              ),
              (
                  '            mutation_operations.sort();\n            mutation_operations.dedup();\n            Ok(InvariantRequirement::ProtectedProperties {\n                protected_properties: normalize_bounded_strings(\n                    protected_properties,\n                    "protected_properties",\n                    limits,\n                )?,\n                mutation_operations,\n            })',
                  '            mutation_operations.sort();\n            mutation_operations.dedup();\n            let protected_properties = normalize_bounded_strings(\n                protected_properties,\n                "protected_properties",\n                limits,\n            )?;\n            require_non_empty_collection("protected_properties", protected_properties.len())?;\n            require_non_empty_collection("mutation_operations", mutation_operations.len())?;\n            Ok(InvariantRequirement::ProtectedProperties {\n                protected_properties,\n                mutation_operations,\n            })',
              ),
              (
                  '            required_guard_kinds.sort();\n            required_guard_kinds.dedup();\n            Ok(InvariantRequirement::ElevatedClientContext {\n                allowed_server_contexts: normalize_bounded_strings(\n                    allowed_server_contexts,\n                    "allowed_server_contexts",\n                    limits,\n                )?,\n                required_guard_kinds,\n            })',
                  '            required_guard_kinds.sort();\n            required_guard_kinds.dedup();\n            let allowed_server_contexts = normalize_bounded_strings(\n                allowed_server_contexts,\n                "allowed_server_contexts",\n                limits,\n            )?;\n            require_non_empty_collection("required_guard_kinds", required_guard_kinds.len())?;\n            Ok(InvariantRequirement::ElevatedClientContext {\n                allowed_server_contexts,\n                required_guard_kinds,\n            })',
              ),
              (
                  "fn enforce_collection_cap(field: &'static str, count: usize, max: usize) -> Result<(), ModelError> {",
                  "fn require_non_empty_collection(\n    field: &'static str,\n    count: usize,\n) -> Result<(), ModelError> {\n    if count == 0 {\n        return Err(ModelError::EmptyRequiredCollection(field));\n    }\n    Ok(())\n}\n\nfn enforce_collection_cap(field: &'static str, count: usize, max: usize) -> Result<(), ModelError> {",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          marker = '''    #[test]\n    fn invariant_definition_normalizes_nested_requirement_sets() {'''
          regression = '''    #[test]\n    fn invariant_definition_rejects_empty_required_sets() {\n        let limits = BusinessLogicLimits::default();\n        let scope = InvariantScope::new(None, Vec::new(), None, Vec::new(), Vec::new(), limits)\n            .expect("scope");\n        let provenance = vec![source("src/invariants.rs", 1)];\n\n        for (requirement, expected_field) in [\n            (\n                InvariantRequirement::RequiredRole { required_roles: Vec::new() },\n                "required_roles",\n            ),\n            (\n                InvariantRequirement::ProtectedProperties {\n                    protected_properties: Vec::new(),\n                    mutation_operations: vec![DataOperationKind::Update],\n                },\n                "protected_properties",\n            ),\n            (\n                InvariantRequirement::ProtectedProperties {\n                    protected_properties: vec!["is_admin".to_owned()],\n                    mutation_operations: Vec::new(),\n                },\n                "mutation_operations",\n            ),\n            (\n                InvariantRequirement::ElevatedClientContext {\n                    allowed_server_contexts: Vec::new(),\n                    required_guard_kinds: Vec::new(),\n                },\n                "required_guard_kinds",\n            ),\n        ] {\n            assert!(matches!(\n                InvariantDefinition::new(\n                    id("r3.invariant", expected_field),\n                    InvariantKind::RequiredRole,\n                    InvariantSource::ProjectDeclaration,\n                    scope.clone(),\n                    requirement,\n                    provenance.clone(),\n                    limits,\n                ),\n                Err(ModelError::EmptyRequiredCollection(field)) if field == expected_field\n            ));\n        }\n\n        InvariantDefinition::new(\n            id("r3.invariant", "elevated-optional-contexts"),\n            InvariantKind::ElevatedClientContext,\n            InvariantSource::ProjectDeclaration,\n            scope,\n            InvariantRequirement::ElevatedClientContext {\n                allowed_server_contexts: Vec::new(),\n                required_guard_kinds: vec![GuardKind::Authentication],\n            },\n            provenance,\n            limits,\n        )\n        .expect("optional allowed server contexts remain optional");\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('could not locate invariant regression insertion point')
          text = text.replace(marker, regression + marker, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all

      - name: Run bounded qualification
        run: |
          cargo +1.98.0 test -p sentrdel-review --lib business_logic::model::tests --locked
          cargo +1.98.0 test -p sentrdel-review --test r3_phase1_contract --locked
          cargo +1.98.0 check -p sentrdel-review --all-targets --locked
          cargo +1.98.0 clippy -p sentrdel-review --all-targets --locked -- -D warnings

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-r3-empty-requirement-repair.yml
          git add crates/sentrdel-review/src/business_logic/model.rs
          git diff --cached --quiet && { echo "Expected repair produced no diff."; exit 1; }
          git commit -m "fix(r3): reject empty invariant requirement sets"
          git push origin HEAD:feat/r3-phase1-contracts-ground-truth
