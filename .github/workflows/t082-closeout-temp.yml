name: T082 Closeout Temporary

on:
  push:
    branches:
      - closeout/001-t082-release-self-security

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t082-release-self-security
      - name: Mark T082 complete and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] T082 Complete self-security CI beyond the early T091 gate: source/dependency qualification validation, Rust 1.98.0 pin/lockfile checks, malicious-package denylist/advisory refresh path, privileged dependency documentation and release-grade policy. `cargo-vet`, if later used, is only for the trusted Sentrdel workspace and never run against arbitrary target repos.'
          new = '- [x] T082 Complete self-security CI beyond the early T091 gate: source/dependency qualification validation, Rust 1.98.0 pin/lockfile checks, malicious-package denylist/advisory refresh path, privileged dependency documentation and release-grade policy. `cargo-vet`, if later used, is only for the trusted Sentrdel workspace and never run against arbitrary target repos.'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one open T082 task line')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/t082-closeout-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(spec): close T082 release self-security task'
          git push origin HEAD:closeout/001-t082-release-self-security
