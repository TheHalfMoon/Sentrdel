name: T092 Live Verification Temporary

on:
  push:
    branches:
      - verify/t092-live-20260829-0954

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify protected main governance with bounded admin credential
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          GH_TOKEN_FALLBACK: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN || true
          if [[ -n "${SENTRDEL_GOVERNANCE_ADMIN_TOKEN:-}" ]]; then
            export GH_TOKEN="$SENTRDEL_GOVERNANCE_ADMIN_TOKEN"
            echo "governance-credential: SENTRDEL_GOVERNANCE_ADMIN_TOKEN present"
          elif [[ -n "${GH_TOKEN_FALLBACK:-}" ]]; then
            export GH_TOKEN="$GH_TOKEN_FALLBACK"
            echo "governance-credential: GH_TOKEN present"
          else
            echo "governance-credential: unavailable"
            exit 3
          fi
          unset SENTRDEL_GOVERNANCE_ADMIN_TOKEN GH_TOKEN_FALLBACK
          python3 scripts/verify_repository_governance.py
