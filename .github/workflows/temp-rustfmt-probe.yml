name: Temporary Rustfmt Probe

on:
  push:
    branches:
      - ci/temp-governance-reverify-20260901

permissions:
  contents: read

jobs:
  rustfmt-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: feat/002-r2-t024-r1-handoff
          fetch-depth: 1
      - name: Require expected candidate head
        run: test "$(git rev-parse HEAD)" = "8673dd985815cd91eaab93384494969759d811a3"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Capture workspace check
        run: |
          set +e
          cargo +1.98.0 check --workspace --all-targets --locked >check.log 2>&1
          status=$?
          cat check.log
          echo "$status" >check.status
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-t024-check-diagnostic
          path: |
            check.log
            check.status
          if-no-files-found: error
          retention-days: 1
