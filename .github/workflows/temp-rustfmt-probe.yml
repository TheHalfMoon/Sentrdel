name: Temporary R2-T027 Format Probe

on:
  push:
    branches:
      - ci/temp-governance-reverify-20260901

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: test/002-r2-t027-e2e-fixtures
          fetch-depth: 1
          path: candidate
      - name: Require expected candidate head
        run: test "$(git -C candidate rev-parse HEAD)" = "18dfe5af89845fb0cd6d4815e818fde6f556451d"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format candidate
        working-directory: candidate
        run: cargo +1.98.0 fmt --all
      - name: Qualify formatted candidate
        working-directory: candidate
        run: |
          cargo +1.98.0 fmt --all --check
          cargo +1.98.0 check --workspace --all-targets --locked
          cargo +1.98.0 test --workspace --locked
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Upload formatted T027 source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-t027-formatted-source
          path: candidate/crates/sentrdel-cli/src/r2_t027_e2e.rs
          if-no-files-found: error
          retention-days: 1
