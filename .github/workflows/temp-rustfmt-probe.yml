name: Temporary R2-T028 Format Probe

on:
  push:
    branches:
      - ci/temp-governance-reverify-20260901

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: test/002-r2-t028-release-gate
          fetch-depth: 1
          path: candidate
      - name: Require expected candidate head
        run: test "$(git -C candidate rev-parse HEAD)" = "3b0e044d9c856d6d8bbed46919347b18b07bf2f1"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format candidate
        working-directory: candidate
        run: cargo +1.98.0 fmt --all
      - name: Upload formatted benchmark
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-t028-formatted-benchmark
          path: candidate/crates/sentrdel-review/tests/r2_t028_release_benchmark.rs
          if-no-files-found: error
          retention-days: 1
      - name: Require formatted candidate
        working-directory: candidate
        run: cargo +1.98.0 fmt --all --check
      - name: Check candidate
        working-directory: candidate
        run: cargo +1.98.0 check --workspace --all-targets --locked
      - name: Test candidate
        working-directory: candidate
        run: cargo +1.98.0 test --workspace --locked
      - name: Clippy candidate
        working-directory: candidate
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
