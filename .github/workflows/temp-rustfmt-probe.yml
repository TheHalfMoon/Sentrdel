name: Temporary R2-T028 Review Repair Diagnostic

on:
  push:
    branches:
      - ci/temp-governance-reverify-20260901

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: test/002-r2-t028-release-gate
          fetch-depth: 1
          path: candidate
      - name: Require expected candidate head
        run: test "$(git -C candidate rev-parse HEAD)" = "439ebcc2a50cc37f9fa8b86c537151b7dd610ad4"
      - name: Apply bounded review repairs
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('crates/sentrdel-review/tests/r2_t028_release_benchmark.rs')
          text = path.read_text()
          new = r'''fn reconciler_is_the_finding_authority(evidence: &[Evidence]) -> bool {
              let categories = [
                  "supabase_rls_posture",
                  "supabase_api_role_grant",
                  "supabase_function_security_mode",
                  "supabase_function_search_path",
                  "supabase_elevated_key_client_boundary",
                  "supabase_storage_policy_posture",
                  "supabase_edge_function_auth_posture",
              ];
              let Ok(reconciler) = ReconcilerAuthority::from_runtime(
                  "sentrdel-reconciler",
                  "sha256:r2-t028-reconciler-config",
              ) else {
                  return false;
              };

              categories.iter().all(|category| {
                  let category_evidence = evidence
                      .iter()
                      .filter(|item| item.claim().category == *category)
                      .take(1)
                      .cloned()
                      .collect::<Vec<_>>();
                  if category_evidence.is_empty() {
                      return false;
                  }

                  let Ok(rule) = ReconciliationRule::from_runtime(
                      category,
                      "supabase-static-posture",
                      "R2 release benchmark authority reconciliation",
                      "Only the existing reconciler may turn provider Evidence into a Finding",
                      Severity::High,
                  ) else {
                      return false;
                  };

                  reconcile_evidence(&category_evidence, &rule, &reconciler, CAPTURED_AT)
                      .is_ok_and(|findings| !findings.is_empty())
              })
          }

          fn fixture_text_has_no_instruction_authority() -> bool {
              [SAFE_BROWSER, UNSAFE_BROWSER].into_iter().all(|source| {
                  matches!(
                      classify_source_execution_context(
                          &path("src/fixture-source.ts"),
                          source,
                          SourceContextLimits::default(),
                      ),
                      Ok(SourceExecutionContext::Unknown)
                  ) && matches!(
                      classify_source_execution_context(
                          &path("src/browser.ts"),
                          source,
                          SourceContextLimits::default(),
                      ),
                      Ok(SourceExecutionContext::BrowserOrClient)
                  )
              })
          }

          fn evaluate_once'''
          pattern = r'fn reconciler_is_the_finding_authority\(evidence: &\[Evidence\]\) -> bool \{.*?\nfn evaluate_once'
          replaced, count = re.subn(pattern, new, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one review-repair block, found {count}')
          path.write_text(replaced)
          PY
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format candidate
        working-directory: candidate
        run: cargo +1.98.0 fmt --all
      - name: Capture check diagnostics
        working-directory: candidate
        shell: bash
        run: |
          set +e
          cargo +1.98.0 check --workspace --all-targets --locked 2>&1 | tee ../r2-t028-review-check.txt
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > ../r2-t028-review-check-exit.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-t028-review-check-diagnostics
          path: |
            r2-t028-review-check.txt
            r2-t028-review-check-exit.txt
          if-no-files-found: error
          retention-days: 1
