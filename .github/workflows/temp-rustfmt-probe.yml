name: Temporary Rustfmt Probe

on:
  push:
    branches:
      - ci/temp-governance-reverify-20260901

permissions:
  contents: write

jobs:
  rustfmt-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: feat/002-r2-t024-r1-handoff
          fetch-depth: 1
      - name: Require expected candidate head
        run: test "$(git rev-parse HEAD)" = "8ed81333072c8f7f31d51bd8e2d73645b6946881"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply pinned formatting
        run: cargo +1.98.0 fmt --all
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git config user.name "Sentrdel Governance Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "Candidate already formatted"
            exit 0
          fi
          git diff --check
          git add crates/sentrdel-review/src/supabase.rs crates/sentrdel-review/src/supabase_detection.rs crates/sentrdel-review/src/profile.rs crates/sentrdel-review/tests/t064_project_profile.rs
          git commit -m "style(r2): apply pinned rustfmt to T024"
          git push origin HEAD:refs/heads/feat/002-r2-t024-r1-handoff
