name: R3 T009 Round 10 Repair

on:
  push:
    branches:
      - repair/r3-t009-review-round10

permissions:
  contents: write

jobs:
  repair-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/r3-t009-review-round10
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply bounded Round 10 repair
        run: python3 .github/r3_t009_round10_patch.py

      - name: Remove temporary repair artifacts
        run: rm .github/r3_t009_round10_patch.py .github/workflows/r3-t009-round10-repair.yml

      - name: Verify bounded changed paths
        run: |
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            crates/sentrdel-review/src/business_logic/route.rs \
            crates/sentrdel-review/tests/r3_t009_route_extraction.rs \
            .github/r3_t009_round10_patch.py \
            .github/workflows/r3-t009-round10-repair.yml | sort)"

      - name: Format repair
        run: cargo +1.98.0 fmt --all

      - name: Verify format contract
        run: cargo +1.98.0 fmt --all -- --check

      - name: Test sentrdel-review library
        run: cargo +1.98.0 test -p sentrdel-review --lib --locked

      - name: Test R3 T009 route extraction
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t009_route_extraction --locked

      - name: Clippy sentrdel-review
        run: cargo +1.98.0 clippy -p sentrdel-review --all-targets --locked -- -D warnings

      - name: Diff integrity
        run: git diff --check

      - name: Re-verify bounded changed paths after rustfmt
        run: |
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            crates/sentrdel-review/src/business_logic/route.rs \
            crates/sentrdel-review/tests/r3_t009_route_extraction.rs \
            .github/r3_t009_round10_patch.py \
            .github/workflows/r3-t009-round10-repair.yml | sort)"

      - name: Commit qualified product repair
        run: |
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add -A
          git commit -m "fix(r3): reject destructured Express receivers"
          git push origin HEAD:repair/r3-t009-review-round10
