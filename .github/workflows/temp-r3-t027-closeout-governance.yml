name: Postmerge Governance Proof T027 Closeout

on:
  push:
    branches:
      - evidence/r3-t027-closeout-governance-a5199e35

permissions:
  contents: read

jobs:
  verify-governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evidence branch without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify live protected-main governance
        shell: bash
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN
          export GITHUB_TOKEN="${SENTRDEL_GOVERNANCE_ADMIN_TOKEN}"
          python3 scripts/verify_repository_governance.py | tee /tmp/governance.txt
          grep -Fx 'repository-governance: PASS' /tmp/governance.txt
          grep -Fx 'repository=TheHalfMoon/Sentrdel' /tmp/governance.txt
          grep -Fx 'branch=main' /tmp/governance.txt
          grep -Fx 'head=a5199e35fd08bba79f18686b33af82721d9d9381' /tmp/governance.txt
          grep -Fx 'required_checks=Dependency security,Resolve and test schema substrate,Rust 1.98 bootstrap' /tmp/governance.txt
