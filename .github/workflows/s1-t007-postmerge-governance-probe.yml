name: S1 T007 Postmerge Governance Probe

on:
  push:
    branches:
      - tmp/s1-t007-postmerge-governance

permissions:
  contents: read

concurrency:
  group: s1-t007-postmerge-governance-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-governance:
    name: Repository governance proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SENTRDEL_EXPECTED_MAIN_SHA: c113d2718b2ef04e0dc87a71bf6363b1031ba93c
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c113d2718b2ef04e0dc87a71bf6363b1031ba93c
          persist-credentials: false

      - name: Require dedicated governance credential
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
        run: |
          if [ -z "${SENTRDEL_GOVERNANCE_ADMIN_TOKEN:-}" ]; then
            echo "repository-governance: ERROR: SENTRDEL_GOVERNANCE_ADMIN_TOKEN is unavailable" >&2
            exit 1
          fi

      - name: Verify protected main governance
        env:
          GITHUB_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          GH_TOKEN: ""
        run: python3 scripts/verify_repository_governance.py
