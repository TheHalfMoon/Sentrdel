name: Temporary R3-T030 rustfmt repair

on:
  push:
    branches:
      - test/r3-t030-e2e-fixtures

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.ref == 'refs/heads/test/r3-t030-e2e-fixtures'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/r3-t030-e2e-fixtures
          persist-credentials: true
          fetch-depth: 1
      - name: Format T030 test and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          rm .github/workflows/temp-r3-t030-rustfmt.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/r3_t030_e2e.rs .github/workflows/temp-r3-t030-rustfmt.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(r3): format T030 E2E test'
          git push origin HEAD:test/r3-t030-e2e-fixtures
