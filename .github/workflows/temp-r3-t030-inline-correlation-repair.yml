name: Temporary R3-T030 inline correlation repair

on:
  push:
    branches:
      - test/r3-t030-e2e-fixtures

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/r3-t030-e2e-fixtures
          persist-credentials: true
          fetch-depth: 1

      - name: Apply conservative inline route-operation correlation repair
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('crates/sentrdel-review/src/business_logic/path.rs')
          text = path.read_text()
          def d(value):
              return base64.b64decode(value).decode()
          anchor = d('cHViIHN0cnVjdCBQYXRoQ29ycmVsYXRpb25JbnB1dHM8J2E+IHsK')
          replacement = d('cHViIGNvbnN0IElOTElORV9ST1VURV9PUEVSQVRJT05fUkVMQVRJT046ICZzdHIgPSAiaW5saW5lX3JvdXRlX2NvbnRhaW5zX29wZXJhdGlvbiI7CgpwdWIgc3RydWN0IFBhdGhDb3JyZWxhdGlvbklucHV0czwnYT4gewo=')
          old = d('')
          new = d('')
          marker = d('Zm4gcXVhbGlmeV9yZXF1aXJlZF9yb2xlX2xpbmtzKAo=')
          helper = d('')
          if text.count(anchor) != 1 or text.count(old) != 1 or text.count(marker) != 1:
              raise SystemExit('path repair anchors do not match canonical source exactly once')
          text = text.replace(anchor, replacement, 1)
          text = text.replace(old, new, 1)
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p sentrdel-review --test r3_t017_inline_route_operation --locked
          cargo +1.98.0 test -p sentrdel-review --test r3_t020_cross_layer_correlation --locked
          cargo +1.98.0 check --workspace --all-targets --locked
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-review/src/business_logic/path.rs crates/sentrdel-review/tests/r3_t017_inline_route_operation.rs
          git commit -m 'fix(r3): correlate unique inline route operations'
          git push origin HEAD:test/r3-t030-e2e-fixtures
