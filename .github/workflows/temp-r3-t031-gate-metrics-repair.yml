name: Temporary R3-T031 gate-metrics repair

on:
  push:
    branches:
      - test/r3-t031-release-benchmark
    paths:
      - .github/workflows/temp-r3-t031-gate-metrics-repair.yml

permissions:
  contents: write

jobs:
  repair-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact parent and bounded helper delta
        shell: bash
        run: |
          set -euo pipefail
          base="63c8b7eafc5f25446a0310f77b75e59989d3019d"
          expected_parent="2e169d74f5b7215f3b2067f468ede113d00803c6"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base"...HEAD | sort | tr '\n' ' ')"
          expected=".github/workflows/temp-r3-t031-gate-metrics-repair.yml crates/sentrdel-review/tests/r3_t031_release_benchmark.rs tests/benchmark/r3-release-suite.json "
          test "$actual" = "$expected"

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Convert early case assertions into machine-recorded gates
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/sentrdel-review/tests/r3_t031_release_benchmark.rs")
          text = path.read_text()

          struct_anchor = "    clean_non_satisfied: u64,\n    clean_case_fp_gate_passed: bool,\n"
          struct_replacement = (
              "    clean_non_satisfied: u64,\n"
              "    clean_case_policy_contract_passed: bool,\n"
              "    clean_case_fp_gate_passed: bool,\n"
              "    unexpected_case_states: Vec<String>,\n"
          )
          if text.count(struct_anchor) != 1:
              raise SystemExit(f"R3ReleaseRun gate field anchor count={text.count(struct_anchor)}")
          text = text.replace(struct_anchor, struct_replacement)

          case_start = "    for case in &cases {\n"
          case_end = "\n    let clean_cases = cases.iter().filter(|case| case.clean).collect::<Vec<_>>();"
          if text.count(case_start) != 1 or text.count(case_end) != 1:
              raise SystemExit("case assertion range anchors are not unique")
          start = text.index(case_start)
          end = text.index(case_end, start)
          case_metric = (
              "    let unexpected_case_states = cases\n"
              "        .iter()\n"
              "        .filter_map(|case| {\n"
              "            let expected = if case.clean {\n"
              "                InvariantEvaluationState::Satisfied\n"
              "            } else {\n"
              "                InvariantEvaluationState::Violated\n"
              "            };\n"
              "            (case.evaluation.state() != expected)\n"
              "                .then(|| format!(\"{}:clean={}\", case.group, case.clean))\n"
              "        })\n"
              "        .collect::<Vec<_>>();\n"
          )
          text = text[:start] + case_metric + text[end:]

          policy_start = "    assert_eq!(\n        suite.clean_case_false_positive_gate.sample_state,\n"
          policy_end = "\n\n    let required = suite\n"
          if text.count(policy_start) != 1 or text.count(policy_end) != 1:
              raise SystemExit("clean-case policy range anchors are not unique")
          start = text.index(policy_start)
          end = text.index(policy_end, start)
          policy_metric = (
              "    let clean_case_policy_contract_passed = suite.clean_case_false_positive_gate.sample_state\n"
              "        == \"INITIAL_FOUR_CASE_STRICT_ZERO\"\n"
              "        && suite\n"
              "            .clean_case_false_positive_gate\n"
              "            .max_false_positive_clean_cases\n"
              "            == 1\n"
              "        && suite.clean_case_false_positive_gate.per_clean_cases == 5;\n"
              "    let clean_case_fp_gate_passed = clean_case_policy_contract_passed\n"
              "        && if clean_cases_evaluated < suite.clean_case_false_positive_gate.per_clean_cases {\n"
              "            clean_false_positives == 0 && clean_non_satisfied == 0\n"
              "        } else {\n"
              "            clean_non_satisfied == 0\n"
              "                && clean_false_positives\n"
              "                    .checked_mul(suite.clean_case_false_positive_gate.per_clean_cases)\n"
              "                    .is_some_and(|scaled| {\n"
              "                        scaled\n"
              "                            <= suite\n"
              "                                .clean_case_false_positive_gate\n"
              "                                .max_false_positive_clean_cases\n"
              "                                .saturating_mul(clean_cases_evaluated)\n"
              "                    })\n"
              "        };"
          )
          text = text[:start] + policy_metric + text[end:]

          init_anchor = (
              "        clean_false_positives,\n"
              "        clean_non_satisfied,\n"
              "        clean_case_fp_gate_passed,\n"
          )
          init_replacement = (
              "        clean_false_positives,\n"
              "        clean_non_satisfied,\n"
              "        clean_case_policy_contract_passed,\n"
              "        clean_case_fp_gate_passed,\n"
              "        unexpected_case_states,\n"
          )
          if text.count(init_anchor) != 1:
              raise SystemExit(f"R3ReleaseRun initialization anchor count={text.count(init_anchor)}")
          text = text.replace(init_anchor, init_replacement)

          test_anchor = (
              "    assert!(first.clean_case_fp_gate_passed);\n"
              "    assert_eq!(first.clean_false_positives, 0);\n"
              "    assert_eq!(first.clean_non_satisfied, 0);\n"
          )
          test_replacement = (
              "    assert!(first.clean_case_policy_contract_passed);\n"
              "    assert!(first.clean_case_fp_gate_passed);\n"
              "    assert!(first.unexpected_case_states.is_empty());\n"
              "    assert_eq!(first.clean_false_positives, 0);\n"
              "    assert_eq!(first.clean_non_satisfied, 0);\n"
          )
          if text.count(test_anchor) != 1:
              raise SystemExit(f"release-gate assertion anchor count={text.count(test_anchor)}")
          path.write_text(text.replace(test_anchor, test_replacement))

      - name: Format candidate
        shell: bash
        run: cargo +1.98.0 fmt --all

      - name: Run focused R3-T031 release benchmark
        shell: bash
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t031_release_benchmark --locked

      - name: Check workspace
        shell: bash
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Require clean patch shape
        shell: bash
        run: git diff --check

      - name: Commit repair, remove helper, and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-r3-t031-gate-metrics-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review/tests/r3_t031_release_benchmark.rs
          git commit -m "test(r3): make release gate metrics fail-visible"
          base="63c8b7eafc5f25446a0310f77b75e59989d3019d"
          actual="$(git diff --name-only "$base"...HEAD | sort | tr '\n' ' ')"
          expected="crates/sentrdel-review/tests/r3_t031_release_benchmark.rs tests/benchmark/r3-release-suite.json "
          test "$actual" = "$expected"
          git push origin HEAD:test/r3-t031-release-benchmark
