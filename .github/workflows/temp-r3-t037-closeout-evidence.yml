name: Temporary R3 T037 Closeout Evidence

on:
  push:
    branches:
      - ci/r3-t037-closeout-evidence

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Verify pinned toolchain
        run: |
          rustc +1.98.0 --version
          cargo +1.98.0 --version
      - name: Format workspace
        run: cargo +1.98.0 fmt --all -- --check
      - name: Check workspace
        run: cargo +1.98.0 check --workspace --all-targets --locked
      - name: Test workspace
        run: cargo +1.98.0 test --workspace --locked -- --nocapture
      - name: Clippy workspace
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: R3 release benchmark
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t031_release_benchmark --locked -- --nocapture
      - name: R3 latency and resource benchmark
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t032_latency_resource_benchmark --locked -- --nocapture
      - name: R3 sample-count contract
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t032_sample_count_contract --locked -- --nocapture
      - name: R3 coverage and producer-authority truth
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t026_evidence_coverage --locked -- --nocapture
      - name: R2 secret and static-authority canaries
        run: cargo +1.98.0 test -p sentrdel-review --test r2_phase4_adversarial --locked -- --nocapture
      - name: R3 adversarial extraction canaries
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t014_extraction_adversarial --locked -- --nocapture
      - name: R3 supported-path and authority E2E canaries
        run: cargo +1.98.0 test -p sentrdel-cli r3_t030_e2e --locked -- --nocapture

  governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify live repository governance
        env:
          GITHUB_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
        run: python3 scripts/verify_repository_governance.py

