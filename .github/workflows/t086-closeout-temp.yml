name: T086 Closeout Temporary

on:
  push:
    branches:
      - closeout/001-t086-final-consistency-analysis

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Close T086 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T086 Run final Spec Kit consistency analysis against constitution + major review + implementation amendments + spec/plan/contracts/tasks and record repairs in `analysis.md`.'
          new = '- [x] T086 Run final Spec Kit consistency analysis against constitution + major review + implementation amendments + spec/plan/contracts/tasks and record repairs in `analysis.md`.'
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('T086 closeout target not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          if git diff --quiet -- specs/001-v0-1-evidence-guard-foundation/tasks.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): close T086 consistency analysis task'
          git push origin HEAD:closeout/001-t086-final-consistency-analysis
