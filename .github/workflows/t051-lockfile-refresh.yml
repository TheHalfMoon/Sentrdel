name: T051 Lockfile Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "crates/sentrdel-guard/Cargo.toml"
      - ".github/workflows/t051-lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T051 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Refresh trusted-workspace lockfile
        run: cargo +1.98.0 generate-lockfile
      - name: Require lockfile-only generated change
        shell: bash
        run: |
          changed="$(git status --short)"
          if [[ -z "$changed" ]]; then
            exit 0
          fi
          if [[ "$changed" != " M Cargo.lock" ]]; then
            printf 'unexpected generated changes:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit refreshed lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): refresh T051 lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
