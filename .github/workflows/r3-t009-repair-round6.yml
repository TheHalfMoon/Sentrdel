name: R3 T009 Repair Round 6

on:
  push:
    branches:
      - repair/r3-t009-review-round6
    paths:
      - .github/r3_t009_round6_patch.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/r3-t009-review-round6
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply bounded review reconciliation
        run: python .github/r3_t009_round6_patch.py

      - name: Format product files
        run: cargo +1.98.0 fmt --all

      - name: Guard repair paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              crates/sentrdel-review/src/business_logic/route.rs|crates/sentrdel-review/tests/r3_t009_route_extraction.rs) ;;
              *) echo "unexpected product path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Test sentrdel-review library
        run: cargo +1.98.0 test -p sentrdel-review --lib --locked

      - name: Test R3 T009 route extraction
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t009_route_extraction --locked

      - name: Clippy sentrdel-review
        run: cargo +1.98.0 clippy -p sentrdel-review --all-targets --locked -- -D warnings

      - name: Commit qualified product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review/src/business_logic/route.rs crates/sentrdel-review/tests/r3_t009_route_extraction.rs
          git commit -m "fix(r3): tighten Express receiver binding proof"
          git rm .github/r3_t009_round6_patch.py .github/workflows/r3-t009-repair-round6.yml
          git commit -m "chore: remove temporary T009 repair round 6"
          git push origin HEAD:repair/r3-t009-review-round6
