name: T087 Closeout Evidence Temporary

on:
  push:
    branches:
      - impl/001-t087-implementation-closeout

permissions:
  contents: read

jobs:
  qualification:
    name: T087 qualification evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Workspace format
        run: cargo +1.98.0 fmt --all -- --check
      - name: Workspace check
        run: cargo +1.98.0 check --workspace --all-targets --locked
      - name: Workspace tests and adversarial suite
        run: cargo +1.98.0 test --workspace --locked -- --nocapture
      - name: Workspace clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Secret persistence canaries
        run: |
          cargo +1.98.0 test -p sentrdel-store --test t019_redaction --locked -- --nocapture
          cargo +1.98.0 test -p sentrdel-store --test t019_state_redaction --locked -- --nocapture
      - name: External engine credential and adversarial canaries
        run: cargo +1.98.0 test -p sentrdel-engine --test t029_adversarial --locked -- --nocapture
      - name: MCP credential and guard canaries
        run: |
          cargo +1.98.0 test -p sentrdel-store --test t058_mcp_guard_e2e --locked -- --nocapture
          cargo +1.98.0 test -p sentrdel-guard --locked -- --nocapture
      - name: R1 release benchmark
        run: cargo +1.98.0 test -p sentrdel-cli --test t077_release_benchmark --locked -- --nocapture
      - name: Review latency benchmark
        run: cargo +1.98.0 test -p sentrdel-cli --test t079_review_latency --locked -- --nocapture
      - name: MCP policy latency and frame benchmark
        run: cargo +1.98.0 test -p sentrdel-guard --test t080_mcp_policy_benchmark --locked -- --nocapture

  governance:
    name: T087 live protected-main governance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify protected main using bounded credential
        shell: bash
        env:
          SENTRDEL_GOVERNANCE_ADMIN_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN || true
          if [[ -n "${SENTRDEL_GOVERNANCE_ADMIN_TOKEN:-}" ]]; then
            export GH_TOKEN="$SENTRDEL_GOVERNANCE_ADMIN_TOKEN"
            echo "credential-source=SENTRDEL_GOVERNANCE_ADMIN_TOKEN"
          elif [[ -n "${FALLBACK_GH_TOKEN:-}" ]]; then
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
            echo "credential-source=GH_TOKEN"
          else
            echo "credential-source=NONE"
            exit 78
          fi
          python3 scripts/verify_repository_governance.py
