name: Temporary T075 Policy Test

on:
  push:
    branches:
      - impl/001-t075-prompt-injection-authority-tests

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Add T075 kernel authority regression and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sentrdel-policy/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          marker = '''    #[test]\n    fn enforcement_boundary_evaluates_and_applies_absorbing_kernel_deny() {'''
          test = '''    #[test]\n    fn t075_hostile_reasoner_allow_text_cannot_downgrade_kernel_deny() {\n        let hostile_model_candidate = Verdict::Allow;\n        let decision = resolve_for_enforcement(\n            denied_kernel_state(),\n            hostile_model_candidate,\n            UndecidableResolution::default(),\n        );\n\n        assert_eq!(decision.verdict(), Verdict::Deny);\n        assert!(decision.kernel().is_deny());\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('policy insertion marker not found exactly once')
          if 't075_hostile_reasoner_allow_text_cannot_downgrade_kernel_deny' in text:
              raise SystemExit('T075 policy regression already present')
          path.write_text(text.replace(marker, test + marker), encoding='utf-8')
          PY
          rm .github/workflows/temp-t075-policy-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-policy/src/lib.rs .github/workflows/temp-t075-policy-test.yml
          git commit -m 'test(policy): prove T075 kernel deny resists model text'
          git push origin HEAD:impl/001-t075-prompt-injection-authority-tests
