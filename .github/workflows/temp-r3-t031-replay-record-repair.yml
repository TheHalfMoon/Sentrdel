name: Temporary R3-T031 machine-record replay repair

on:
  push:
    branches:
      - test/r3-t031-release-benchmark
    paths:
      - .github/workflows/temp-r3-t031-replay-record-repair.yml

permissions:
  contents: write

jobs:
  repair-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact pre-helper parent and bounded delta
        shell: bash
        run: |
          set -euo pipefail
          base="63c8b7eafc5f25446a0310f77b75e59989d3019d"
          expected_parent="541cca23c635482fa66b09e7cc37f5fdcf668dbc"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base"...HEAD | sort | tr '\n' ' ')"
          expected=".github/workflows/r3-t031-final-replay-fix.yml .github/workflows/temp-r3-t031-replay-record-repair.yml crates/sentrdel-review/tests/r3_t031_release_benchmark.rs tests/benchmark/r3-release-suite.json "
          test "$actual" = "$expected"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Derive replay gate from serialized run records
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/sentrdel-review/tests/r3_t031_release_benchmark.rs")
          text = path.read_text()

          old_state = '        deterministic_replay: "REPLAY_EQUAL".to_owned(),\n'
          new_state = '        deterministic_replay: "NOT_EVALUATED".to_owned(),\n'
          if text.count(old_state) != 1:
              raise SystemExit("deterministic replay state anchor not found exactly once")
          text = text.replace(old_state, new_state)

          old_test = '''    let first = evaluate_once();
              let replay = evaluate_once();
              assert_eq!(first, replay);
              assert!(first.clean_case_fp_gate_passed);
          '''
          new_test = '''    let mut first = evaluate_once();
              let replay = evaluate_once();
              assert_eq!(first, replay);
              let first_record =
                  serde_json::to_vec(&first).expect("serialize first R3 release record");
              let replay_record =
                  serde_json::to_vec(&replay).expect("serialize replay R3 release record");
              let deterministic_replay = first_record == replay_record;
              assert!(deterministic_replay);
              first.deterministic_replay = if deterministic_replay {
                  "REPLAY_EQUAL"
              } else {
                  "REPLAY_MISMATCH"
              }
              .to_owned();
              assert!(first.clean_case_fp_gate_passed);
          '''
          if text.count(old_test) != 1:
              raise SystemExit("release-gate test anchor not found exactly once")
          path.write_text(text.replace(old_test, new_test))

      - name: Format candidate
        shell: bash
        run: cargo +1.98.0 fmt --all

      - name: Run focused R3-T031 release benchmark
        shell: bash
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t031_release_benchmark --locked

      - name: Check workspace
        shell: bash
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Require clean patch shape
        shell: bash
        run: git diff --check

      - name: Commit repair, remove helpers, and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r3-t031-final-replay-fix.yml
          git rm .github/workflows/temp-r3-t031-replay-record-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review/tests/r3_t031_release_benchmark.rs
          git commit -m "test(r3): derive replay gate from serialized record"
          base="63c8b7eafc5f25446a0310f77b75e59989d3019d"
          actual="$(git diff --name-only "$base"...HEAD | sort | tr '\n' ' ')"
          expected="crates/sentrdel-review/tests/r3_t031_release_benchmark.rs tests/benchmark/r3-release-suite.json "
          test "$actual" = "$expected"
          git push origin HEAD:test/r3-t031-release-benchmark
