name: T085 Closeout

on:
  push:
    branches:
      - closeout/001-t085-readme-r1-capabilities

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t085-readme-r1-capabilities
          persist-credentials: true
          fetch-depth: 1
      - name: Mark T085 complete and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T085 Update README with implemented/verified capabilities and explicit non-claims; Supabase deep pack, remote MCP, Verify, general Security Memory and autonomous Research/Learning remain roadmap only.'
          new = old.replace('- [ ]', '- [x]', 1)
          if text.count(old) != 1:
              raise SystemExit('T085 open checkbox not found exactly once; refusing edit')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/t085-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md .github/workflows/t085-closeout.yml
          git commit -m 'docs(spec): close T085 README task'
          git push origin HEAD:closeout/001-t085-readme-r1-capabilities
