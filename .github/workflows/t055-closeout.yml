name: T055 Closeout

on:
  push:
    branches:
      - closeout/001-t055-guard-mcp-cli

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t055-guard-mcp-cli
      - name: Close T055 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] T055 [US2] Implement `sentrdel guard mcp` CLI with ENFORCED fidelity for proxied stdio path and chain/head summary.'
          new = old.replace('- [ ]', '- [x]', 1)
          if text.count(old) != 1:
              raise SystemExit('expected exactly one open T055 task')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/t055-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): close T055 guard MCP CLI task'
          git push origin HEAD:closeout/001-t055-guard-mcp-cli
