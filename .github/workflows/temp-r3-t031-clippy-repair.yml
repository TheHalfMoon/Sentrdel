name: Temporary R3-T031 clippy repair

on:
  push:
    branches:
      - test/r3-t031-release-benchmark
    paths:
      - .github/workflows/temp-r3-t031-clippy-repair.yml

permissions:
  contents: write

jobs:
  repair-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact parent and bounded helper delta
        shell: bash
        run: |
          set -euo pipefail
          base="63c8b7eafc5f25446a0310f77b75e59989d3019d"
          expected_parent="0f13a6ef2ef20d53c3359b7b3882403064a0f811"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base"...HEAD | sort | tr '\n' ' ')"
          expected=".github/workflows/temp-r3-t031-clippy-repair.yml crates/sentrdel-review/tests/r3_t031_release_benchmark.rs tests/benchmark/r3-release-suite.json "
          test "$actual" = "$expected"

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Replace fixed case Vec with array
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/sentrdel-review/tests/r3_t031_release_benchmark.rs")
          text = path.read_text()
          old = "    let cases = vec![\n"
          new = "    let cases = [\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one fixed-case Vec anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new))

      - name: Format contract
        shell: bash
        run: cargo +1.98.0 fmt --all -- --check

      - name: Run focused R3-T031 release benchmark
        shell: bash
        run: cargo +1.98.0 test -p sentrdel-review --test r3_t031_release_benchmark --locked

      - name: Check workspace
        shell: bash
        run: cargo +1.98.0 check --workspace --all-targets --locked

      - name: Run full workspace tests
        shell: bash
        run: cargo +1.98.0 test --workspace --locked

      - name: Run full workspace clippy
        shell: bash
        run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Require clean patch shape
        shell: bash
        run: git diff --check

      - name: Commit repair, remove helper, and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-r3-t031-clippy-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review/tests/r3_t031_release_benchmark.rs
          git commit -m "test(r3): satisfy release benchmark clippy contract"
          base="63c8b7eafc5f25446a0310f77b75e59989d3019d"
          actual="$(git diff --name-only "$base"...HEAD | sort | tr '\n' ' ')"
          expected="crates/sentrdel-review/tests/r3_t031_release_benchmark.rs tests/benchmark/r3-release-suite.json "
          test "$actual" = "$expected"
          git push origin HEAD:test/r3-t031-release-benchmark
