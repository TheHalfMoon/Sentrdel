name: T051 Closeout Checkbox

on:
  push:
    branches:
      - closeout/001-t051-mcp-inventory

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t051-mcp-inventory
          persist-credentials: true
          fetch-depth: 1
      - name: Mark exactly T051 complete
        shell: python
        run: |
          from pathlib import Path
          path = Path("specs/001-v0-1-evidence-guard-foundation/tasks.md")
          text = path.read_text()
          old = "- [ ] T051 [P] [US2] Implement MCP server/tool inventory and bounded description/schema hashes; cap metadata bytes/depth before storage/policy/reasoning."
          new = "- [x] T051 [P] [US2] Implement MCP server/tool inventory and bounded description/schema hashes; cap metadata bytes/depth before storage/policy/reasoning."
          if text.count(old) != 1:
              raise SystemExit("expected exactly one open T051 checkbox")
          path.write_text(text.replace(old, new))
      - name: Require tasks-only generated change
        shell: bash
        run: |
          changed="$(git status --short)"
          if [[ "$changed" != " M specs/001-v0-1-evidence-guard-foundation/tasks.md" ]]; then
            printf 'unexpected generated changes:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit closeout checkbox
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m "docs(spec): mark T051 complete"
          git push origin HEAD:closeout/001-t051-mcp-inventory
