name: T092 Governance Activation Probe

on:
  push:
    branches:
      - impl/001-t092-repository-governance

permissions:
  contents: read

jobs:
  governance-activation-probe:
    name: T092 governance activation probe (non-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        # actions/checkout v4.4.0 — immutable pin; do not use a mutable tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Detect bounded governance credential
        id: credential
        shell: bash
        env:
          DEDICATED_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ -n "${DEDICATED_TOKEN}" ]]; then
            echo "::add-mask::${DEDICATED_TOKEN}"
            echo "source=dedicated" >> "${GITHUB_OUTPUT}"
            echo "Dedicated governance credential is configured."
          elif [[ -n "${FALLBACK_GH_TOKEN}" ]]; then
            echo "::add-mask::${FALLBACK_GH_TOKEN}"
            echo "source=gh_token" >> "${GITHUB_OUTPUT}"
            echo "GH_TOKEN repository secret is configured for bounded governance use."
          else
            echo "source=none" >> "${GITHUB_OUTPUT}"
            echo "No bounded governance credential is configured; no mutation will be attempted."
          fi

      - name: Apply and verify canonical main protection
        if: steps.credential.outputs.source != 'none'
        shell: bash
        env:
          DEDICATED_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CREDENTIAL_SOURCE: ${{ steps.credential.outputs.source }}
          SENTRDEL_APPLY_REPOSITORY_GOVERNANCE: "1"
        run: |
          if [[ "${CREDENTIAL_SOURCE}" == "dedicated" ]]; then
            export GH_TOKEN="${DEDICATED_TOKEN}"
          else
            export GH_TOKEN="${FALLBACK_GH_TOKEN}"
          fi
          python3 scripts/apply_repository_governance.py

      - name: Record fail-closed external blocker
        if: steps.credential.outputs.source == 'none'
        run: |
          echo "T092 activation probe: BLOCKED_NO_BOUNDED_ADMIN_TOKEN"
