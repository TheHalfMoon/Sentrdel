name: R2 T002 format repair

on:
  push:
    branches:
      - impl/002-r2-t002-supabase-pack-manifest

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: impl/002-r2-t002-supabase-pack-manifest
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply canonical formatting
        run: cargo +1.98.0 fmt --all
      - name: Commit formatter-only repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(r2): apply canonical Rust formatting [skip ci]"
          git push origin HEAD:impl/002-r2-t002-supabase-pack-manifest
