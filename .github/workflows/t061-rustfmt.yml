name: T061 Rustfmt

on:
  push:
    branches:
      - impl/001-t061-security-pack-registry

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T061 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply canonical formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          rm .github/workflows/t061-rustfmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-review/src/pack_registry.rs .github/workflows/t061-rustfmt.yml
          git commit -m 'style(review): format T061 pack registry'
          git push origin HEAD:impl/001-t061-security-pack-registry
