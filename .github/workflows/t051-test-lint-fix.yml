name: T051 Test Lint Fix

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/sentrdel-guard/src/mcp/inventory.rs"
      - ".github/workflows/t051-test-lint-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T051 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact test-only lint replacements
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/sentrdel-guard/src/mcp/inventory.rs")
          text = path.read_text()
          replacements = {
              "        let mut limits = McpInventoryLimits::default();\n        limits.max_description_bytes = 8;": "        let limits = McpInventoryLimits {\n            max_description_bytes: 8,\n            ..McpInventoryLimits::default()\n        };",
              "        let mut limits = McpInventoryLimits::default();\n        limits.max_schema_depth = 2;": "        let limits = McpInventoryLimits {\n            max_schema_depth: 2,\n            ..McpInventoryLimits::default()\n        };",
              "        let mut limits = McpInventoryLimits::default();\n        limits.max_tools = 1;": "        let limits = McpInventoryLimits {\n            max_tools: 1,\n            ..McpInventoryLimits::default()\n        };",
              "        let mut limits = McpInventoryLimits::default();\n        limits.max_total_metadata_bytes = 20;": "        let limits = McpInventoryLimits {\n            max_total_metadata_bytes: 20,\n            ..McpInventoryLimits::default()\n        };",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match for: {old!r}")
              text = text.replace(old, new)
          path.write_text(text)
      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format trusted workspace
        run: cargo +1.98.0 fmt --all
      - name: Require inventory-only generated change
        shell: bash
        run: |
          changed="$(git status --short)"
          if [[ "$changed" != " M crates/sentrdel-guard/src/mcp/inventory.rs" ]]; then
            printf 'unexpected generated changes:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit exact lint repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-guard/src/mcp/inventory.rs
          git commit -m "fix(guard): initialize T051 test limits directly"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
