name: T051 Clippy Fix

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/sentrdel-guard/src/mcp/inventory.rs"
      - ".github/workflows/t051-clippy-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T051 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Apply machine-applicable Clippy fixes
        run: cargo +1.98.0 clippy --fix --workspace --all-targets --locked --allow-dirty --allow-staged -- -D warnings
      - name: Format trusted workspace
        run: cargo +1.98.0 fmt --all
      - name: Require inventory-only generated change
        shell: bash
        run: |
          changed="$(git status --short)"
          if [[ -z "$changed" ]]; then
            exit 0
          fi
          if [[ "$changed" != " M crates/sentrdel-guard/src/mcp/inventory.rs" ]]; then
            printf 'unexpected generated changes:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet -- crates/sentrdel-guard/src/mcp/inventory.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-guard/src/mcp/inventory.rs
          git commit -m "fix(guard): satisfy T051 clippy gates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
