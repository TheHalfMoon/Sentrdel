name: Temporary T040 Closeout

on:
  push:
    branches:
      - closeout/001-t040-high-signal-structural-rules

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Close T040 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T040 [P] [US1] Implement deliberately small high-signal structural rule set + positive/negative fixtures.'
          new = '- [x] T040 [P] [US1] Implement deliberately small high-signal structural rule set + positive/negative fixtures.'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one open T040 task line')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md
          git commit -m 'docs(spec): close T040 structural rules task'
          git rm .github/workflows/temp-close-t040.yml
          git commit -m 'ci(temp): remove T040 closeout workflow'
          git push origin HEAD:closeout/001-t040-high-signal-structural-rules
