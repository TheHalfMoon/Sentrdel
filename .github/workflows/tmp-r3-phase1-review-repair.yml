name: Temporary R3 Phase1 Review Repair

on:
  push:
    branches:
      - feat/r3-phase1-contracts-ground-truth

permissions:
  contents: write

jobs:
  repair-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-phase1-contracts-ground-truth
          fetch-depth: 0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sentrdel-review/src/business_logic/model.rs')
          text = path.read_text()
          text = text.replace(
              'pub const fn coverage_state(&self) -> CoverageState { self.coverage_state }',
              'pub fn coverage_state(&self) -> &CoverageState { &self.coverage_state }',
          )
          text = text.replace(
              'pub const fn state(&self) -> CoverageState { self.state }',
              'pub fn state(&self) -> &CoverageState { &self.state }',
          )
          path.write_text(text)
          PY
          cargo +1.98.0 fmt --all

      - name: Check review crate and tests
        run: cargo +1.98.0 check -p sentrdel-review --all-targets --locked

      - name: Commit qualified formatter and repair output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(r3): qualify reviewed phase1 repair"
          git push origin HEAD:feat/r3-phase1-contracts-ground-truth
