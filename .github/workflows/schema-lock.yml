name: Schema Lock Qualification

on:
  pull_request:
    paths:
      - 'crates/sentrdel-schema/**'
      - 'schemas/v1/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/schema-lock.yml'
  push:
    branches:
      - main
      - 'impl/**'
    paths:
      - 'crates/sentrdel-schema/**'
      - 'schemas/v1/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/schema-lock.yml'

permissions:
  contents: read
  statuses: write

jobs:
  schema-lock:
    name: Resolve and test schema substrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Verify committed lockfile and dependency tree
        run: cargo +1.98.0 tree --workspace --locked

      - name: Format ephemeral checkout before semantic qualification
        run: cargo +1.98.0 fmt --all

      - name: Upload runner-formatted schema sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-formatted-sources
          path: crates/sentrdel-schema/src
          if-no-files-found: error
          retention-days: 1

      - name: Semantic qualification
        run: |
          set -euo pipefail
          cargo +1.98.0 check --workspace --all-targets --locked
          cargo +1.98.0 test --workspace --locked
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Generate public wire schemas
        run: cargo +1.98.0 run -p sentrdel-schema --bin export_schemas --locked

      - name: Upload generated public wire schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentrdel-schemas-v1
          path: schemas/v1
          if-no-files-found: error
          retention-days: 1

      - name: Require generated schemas to match committed artifacts
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- schemas/v1)" ]; then
            git status --short -- schemas/v1
            git diff -- schemas/v1
            exit 1
          fi

      - name: Require committed source to match rustfmt
        run: git diff --exit-code -- crates/sentrdel-schema/src

      - name: Publish auditable qualification status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="schema substrate qualification passed"
          else
            STATE=failure
            DESCRIPTION="schema substrate qualification failed; inspect run"
          fi
          PAYLOAD=$(printf '{"state":"%s","target_url":"%s","description":"%s","context":"sentrdel/schema-substrate"}' "$STATE" "$RUN_URL" "$DESCRIPTION")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$COMMIT_SHA" \
            -d "$PAYLOAD"
