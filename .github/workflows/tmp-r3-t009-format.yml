name: Temporary R3 T009 Formatter

on:
  push:
    branches:
      - feat/r3-t009-bounded-route-extraction

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T009 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t009-bounded-route-extraction
          fetch-depth: 0

      - name: Install pinned Rust formatter
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format candidate
        shell: bash
        run: cargo +1.98.0 fmt --all

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sentrdel-review/src/business_logic/route.rs crates/sentrdel-review/tests/r3_t009_route_extraction.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(r3): format T009 route extraction"
          git push origin HEAD:feat/r3-t009-bounded-route-extraction
