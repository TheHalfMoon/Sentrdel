name: Temporary R3 T007 Review Format Repair

on:
  push:
    branches:
      - feat/r3-t007-typescript-grammar-qualification

permissions:
  contents: write

jobs:
  repair-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/r3-t007-typescript-grammar-qualification
          fetch-depth: 0

      - name: Apply exact review formatting repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          report = Path('docs/third-party/tree-sitter-typescript-qualification.md')
          lines = report.read_text(encoding='utf-8').splitlines()
          for index in (2, 3, 4):
              lines[index] = lines[index].rstrip(' \t')
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          for name in (
              'docs/third-party/source-qualification-ledger.md',
              'specs/003-business-logic-invariants/tasks.md',
          ):
              path = Path(name)
              data = path.read_bytes()
              if not data.endswith(b'\n'):
                  path.write_bytes(data + b'\n')
          PY
          git diff --check -- \
            docs/third-party/tree-sitter-typescript-qualification.md \
            docs/third-party/source-qualification-ledger.md \
            specs/003-business-logic-invariants/tasks.md
          git status --short

      - name: Commit exact review repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/third-party/tree-sitter-typescript-qualification.md \
            docs/third-party/source-qualification-ledger.md \
            specs/003-business-logic-invariants/tasks.md
          git diff --cached --check
          git commit -m "chore(r3): reconcile T007 review formatting"
          git push origin HEAD:feat/r3-t007-typescript-grammar-qualification
