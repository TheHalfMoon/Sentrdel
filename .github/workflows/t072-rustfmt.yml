name: T072 Rustfmt Repair

on:
  push:
    branches:
      - impl/001-t072-local-ollama-reasoner

permissions:
  contents: write

jobs:
  format:
    name: Apply pinned rustfmt to T072 files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T072 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t072-local-ollama-reasoner
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format only expected T072 diff
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(crates/sentrdel-review/src/reasoner/local\.rs|crates/sentrdel-review/tests/t072_local_ollama_reasoner\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected rustfmt paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-review/src/reasoner/local.rs crates/sentrdel-review/tests/t072_local_ollama_reasoner.rs
          git commit -m 'style(review): apply pinned rustfmt to T072'
          git push origin HEAD:impl/001-t072-local-ollama-reasoner
