name: T056 Rustfmt Fix

on:
  push:
    branches:
      - impl/001-t056-safe-git-hook-metadata

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t056-safe-git-hook-metadata
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply canonical rustfmt and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          git rm .github/workflows/t056-rustfmt-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-guard/src/git_hooks.rs crates/sentrdel-guard/src/lib.rs
          git commit -m 'style(guard): apply Rust 1.98 formatting'
          git push origin HEAD:impl/001-t056-safe-git-hook-metadata
