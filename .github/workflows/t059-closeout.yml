name: T059 Closeout

on:
  push:
    branches:
      - closeout/001-t059-language-ecosystem-detection

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Record canonical T059 completion and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text()
          old = '- [ ] T059 [P] [US3] Implement bounded language/ecosystem detection using files/config only.'
          new = old.replace('- [ ]', '- [x]', 1)
          if old not in text:
              raise SystemExit('expected canonical T059 task line not found or already changed')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/t059-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md .github/workflows/t059-closeout.yml
          git commit -m 'docs(spec): close T059 project detection task'
          git push origin HEAD:closeout/001-t059-language-ecosystem-detection
