name: T076 Closeout

on:
  push:
    branches:
      - closeout/001-t076-reason-network-wiring

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t076-reason-network-wiring
      - name: Mark T076 complete and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] T076 [US5] Wire `--reason`/`--no-network` without deterministic review dependence on a model.'
          new = '- [x] T076 [US5] Wire `--reason`/`--no-network` without deterministic review dependence on a model.'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one open T076 checkbox')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/t076-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md .github/workflows/t076-closeout.yml
          git commit -m 'docs(spec): close T076 optional reasoner wiring'
          git push origin HEAD:closeout/001-t076-reason-network-wiring
