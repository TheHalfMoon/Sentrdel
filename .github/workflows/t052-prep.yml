name: T052 Prepare

on:
  push:
    branches:
      - "impl/001-t052-stdio-gateway"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout T052 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t052-stdio-gateway
          persist-credentials: true
          fetch-depth: 1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Refresh lockfile
        run: cargo +1.98.0 generate-lockfile
      - name: Format workspace
        run: cargo +1.98.0 fmt --all
      - name: Apply machine-applicable Clippy fixes
        run: cargo +1.98.0 clippy --fix --workspace --all-targets --locked --allow-dirty --allow-staged -- -D warnings
      - name: Format after Clippy
        run: cargo +1.98.0 fmt --all
      - name: Commit generated preparation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/sentrdel-guard/src/mcp/gateway.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix(guard): prepare T052 gateway for qualification"
          git push origin HEAD:impl/001-t052-stdio-gateway
