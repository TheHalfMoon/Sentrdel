name: Temporary T076 Module Export

on:
  push:
    branches:
      - impl/001-t076-reason-network-wiring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Export reasoning module and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sentrdel-cli/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'pub mod review;\n'
          replacement = 'pub mod reasoning;\npub mod review;\n'
          if text.count(marker) != 1:
              raise SystemExit('review module marker not found exactly once')
          if 'pub mod reasoning;' in text:
              raise SystemExit('reasoning module already exported')
          path.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY
          rm .github/workflows/temp-t076-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/lib.rs .github/workflows/temp-t076-export.yml
          git commit -m 'feat(cli): export T076 optional reasoning wiring'
          git push origin HEAD:impl/001-t076-reason-network-wiring
