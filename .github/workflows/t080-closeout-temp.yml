name: T080 Closeout Temporary

on:
  push:
    branches:
      - closeout/001-t080-mcp-policy-latency-memory

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: closeout/001-t080-mcp-policy-latency-memory
      - name: Mark T080 complete and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/001-v0-1-evidence-guard-foundation/tasks.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] T080 [P] Add MCP in-process policy latency target (<50ms p95 excluding downstream/human/framing wait) plus bounded-frame memory tests.'
          new = '- [x] T080 [P] Add MCP in-process policy latency target (<50ms p95 excluding downstream/human/framing wait) plus bounded-frame memory tests.'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one open T080 task line')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/t080-closeout-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/001-v0-1-evidence-guard-foundation/tasks.md .github/workflows/t080-closeout-temp.yml
          git commit -m 'docs(spec): close T080 MCP latency task'
          git push origin HEAD:closeout/001-t080-mcp-policy-latency-memory
