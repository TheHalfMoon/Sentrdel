name: Temporary R3 T009 Test Semantics Reconciliation

on:
  push:
    branches:
      - feat/r3-t009-bounded-route-extraction
    paths:
      - .github/workflows/tmp-r3-t009-test-semantics.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/r3-t009-bounded-route-extraction
          fetch-depth: 0
          persist-credentials: true

      - name: Guard against concurrent feature-head movement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/r3-t009-bounded-route-extraction
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/r3-t009-bounded-route-extraction)"

      - name: Reconcile stale unit-test expectation only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/sentrdel-review/src/business_logic/model.rs")
          text = path.read_text()
          old_name = "fn route_constructor_normalizes_and_caps_collections() {"
          new_name = "fn route_constructor_preserves_callback_order_and_normalizes_provenance() {"
          old_assert = '        assert_eq!(route.callback_chain(), &[a, id("r3.callback", "b")]);'
          new_assert = '''        assert_eq!(
              route.callback_chain(),
              &[id("r3.callback", "b"), a, id("r3.callback", "b")]
          );'''
          if text.count(old_name) != 1:
              raise SystemExit("expected exactly one stale route-constructor test name")
          if text.count(old_assert) != 1:
              raise SystemExit("expected exactly one stale callback-chain assertion")
          text = text.replace(old_name, new_name, 1).replace(old_assert, new_assert, 1)
          path.write_text(text)
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all

      - name: Run sentrdel-review library tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test -p sentrdel-review --lib

      - name: Run focused T009 regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test -p sentrdel-review --test r3_t009_route_extraction

      - name: Run focused Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy -p sentrdel-review --all-targets -- -D warnings

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-r3-t009-test-semantics.yml

      - name: Guard final diff and push product-only test correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/r3-t009-bounded-route-extraction
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/r3-t009-bounded-route-extraction)"

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            ".github/workflows/tmp-r3-t009-test-semantics.yml"
            "crates/sentrdel-review/src/business_logic/model.rs"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[*]}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(r3): preserve callback execution-order expectation"
          git push origin HEAD:feat/r3-t009-bounded-route-extraction
