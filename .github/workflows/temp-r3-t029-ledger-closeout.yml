name: Temporary R3-T029 ledger closeout

on:
  push:
    branches:
      - chore/r3-t029-ledger-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/r3-t029-ledger-closeout
          persist-credentials: true
          fetch-depth: 1

      - name: Mark only R3-T029 complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('specs/003-business-logic-invariants/tasks.md')
          text = path.read_text()
          open_line = '- [ ] **R3-T029** Extend `sentrdel explain` so R3 Findings can show the bounded supported route → guard/actor → data/client → invariant chain, R2 supporting Evidence and explicit static/coverage limitations; graph metadata is explanation context, not verdict authority.'
          closed_line = open_line.replace('- [ ]', '- [x]', 1)
          open_count = text.count(open_line)
          closed_count = text.count(closed_line)
          if open_count == 1 and closed_count == 0:
              path.write_text(text.replace(open_line, closed_line, 1))
          elif open_count == 0 and closed_count == 1:
              print('R3-T029 is already closed; no mutation needed')
          else:
              raise SystemExit(f'unexpected R3-T029 ledger state: open={open_count}, closed={closed_count}')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -z "${changed}" ]]; then
            exit 0
          fi
          if [[ "${changed}" != 'specs/003-business-logic-invariants/tasks.md' ]]; then
            printf 'unexpected closeout paths:\n%s\n' "${changed}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/003-business-logic-invariants/tasks.md
          git commit -m 'chore(r3): close R3-T029 task ledger'
          git push origin HEAD:chore/r3-t029-ledger-closeout
