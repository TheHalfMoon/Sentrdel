name: R2 Readiness Closeout Temp

on:
  push:
    branches:
      - closeout/002-r2-planning-readiness

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Close R2 planning readiness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('specs/002-supabase-static-posture/checklists/implementation-readiness.md'): [
                  ('- [ ] Planning PR is exact-head qualified, review-clean, merged with expected-head protection, and proven canonical on protected `main`.',
                   '- [x] Planning PR is exact-head qualified, review-clean, merged with expected-head protection, and proven canonical on protected `main`.'),
              ],
              Path('specs/002-supabase-static-posture/tasks.md'): [
                  ('- [ ] R2-T001 Canonicalize the complete R2 Spec Kit planning slice on protected `main`:',
                   '- [x] R2-T001 Canonicalize the complete R2 Spec Kit planning slice on protected `main`:'),
                  ('**Status:** PLANNING — implementation blocked until R2 planning is canonical and the readiness closeout is complete.',
                   '**Status:** IMPLEMENTATION_READY — R2 planning is canonical; proceed in task order.'),
              ],
              Path('specs/000-sentrdel-roadmap/roadmap.md'): [
                  ('| R1 | Evidence + Guard Foundation | Ship a useful Rust CLI for diff review, canonical evidence, stack detection, bounded stdio MCP guard, git guard seams, coverage gaps, high-signal baseline checks, and the minimum immutable evaluation foundation required to measure quality before detector breadth | — | implementation-in-progress | `specs/001-v0-1-evidence-guard-foundation/` |',
                   '| R1 | Evidence + Guard Foundation | Ship a useful Rust CLI for diff review, canonical evidence, stack detection, bounded stdio MCP guard, git guard seams, coverage gaps, high-signal baseline checks, and the minimum immutable evaluation foundation required to measure quality before detector breadth | — | complete | `specs/001-v0-1-evidence-guard-foundation/` |'),
                  ('| R2 | **Supabase P0 Static/Posture Pack** | Offline deterministic Supabase security posture: RLS/policies, grants/functions, SECURITY DEFINER/search_path, exposed schemas/sensitive columns, service-role/client boundaries, Storage and Auth/config signals; separate optional live posture later | R1 | planned | — |',
                   '| R2 | **Supabase P0 Static/Posture Pack** | Offline deterministic Supabase security posture: RLS/policies, grants/functions, SECURITY DEFINER/search_path, exposed schemas/sensitive columns, service-role/client boundaries, Storage and Auth/config signals; separate optional live posture later | R1 | implementation-ready | `specs/002-supabase-static-posture/` |'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'expected text not found in {path}: {old}')
              path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/000-sentrdel-roadmap/roadmap.md specs/002-supabase-static-posture/checklists/implementation-readiness.md specs/002-supabase-static-posture/tasks.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(spec): close R2 planning readiness gate'
          git push origin HEAD:closeout/002-r2-planning-readiness
