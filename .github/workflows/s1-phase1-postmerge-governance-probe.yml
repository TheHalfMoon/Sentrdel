name: S1 Phase 1 Postmerge Governance Probe

on:
  push:
    branches:
      - tmp/s1-phase1-postmerge-governance

permissions:
  contents: read

concurrency:
  group: s1-phase1-postmerge-governance-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTRDEL_EXPECTED_MAIN_SHA: cfaaf35895094b4106450186df694b48331ea8c2
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cfaaf35895094b4106450186df694b48331ea8c2
          persist-credentials: false
      - name: Verify protected main governance
        env:
          GITHUB_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_READ_TOKEN }}
        run: python3 scripts/verify_repository_governance.py
