name: Temporary T041 Formatter

on:
  push:
    branches:
      - impl/001-t041-changed-secret-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format and clean up
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-review/src/secrets.rs crates/sentrdel-review/tests/t041_changed_secret.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style(review): apply T041 rustfmt output'
          fi
          git rm .github/workflows/temp-format-t041.yml
          git commit -m 'ci(temp): remove T041 formatter'
          git push origin HEAD:impl/001-t041-changed-secret-evidence
