name: T065 Qualify

on:
  push:
    branches:
      - impl/001-t065-init-output

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t065-init-output
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Wire init module, refresh lockfile, and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sentrdel-cli/src/lib.rs')
          text = path.read_text()
          old = 'pub mod guard_mcp;\npub mod review;'
          new = 'pub mod guard_mcp;\npub mod init;\npub mod review;'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('unexpected CLI module declarations')
              path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 check --workspace --all-targets
          cargo +1.98.0 fmt --all
      - name: Commit qualified branch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/sentrdel-cli
          if ! git diff --cached --quiet; then
            git commit -m "build(cli): qualify T065 init output"
          fi
          git rm .github/workflows/t065-qualify.yml
          git commit -m "ci(temp): remove T065 qualification workflow"
          git push origin HEAD:impl/001-t065-init-output
