name: T079 Implementation

on:
  push:
    branches:
      - impl/001-t079-review-latency-benchmark

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t079-review-latency-benchmark
      - name: Integrate T079 release dimension
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          suite = Path('tests/benchmark/r1-release-suite.json')
          text = suite.read_text()
          old = '''    {
                "id": "review_latency",
                "state": "NOT_MEASURED",
                "owner_task": "T079",
                "scenarios": ["warm-review-small", "warm-review-broader"]
              },'''.replace('              ', '')
          new = old.replace('"NOT_MEASURED"', '"MEASURED"')
          if text.count(old) != 1:
              raise SystemExit('expected exactly one deferred review_latency dimension')
          suite.write_text(text.replace(old, new, 1))

          test = Path('crates/sentrdel-cli/tests/t077_release_benchmark.rs')
          text = test.read_text()
          old = '''    for (deferred, owner) in [
              ("review_latency", "T079"),
              ("review_memory", "T079"),
              ("guard_latency", "T080"),
              ("guard_bounded_frame_memory", "T080"),
          ] {'''.replace('          ', '')
          new = '''    assert_eq!(dimensions["review_latency"].state, MetricState::Measured);
          assert_eq!(dimensions["review_latency"].owner_task, "T079");
          for (deferred, owner) in [
              ("review_memory", "T079"),
              ("guard_latency", "T080"),
              ("guard_bounded_frame_memory", "T080"),
          ] {'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('expected T077 deferred measurement loop')
          text = text.replace(old, new, 1)
          old = '    assert_eq!(first.deferred_measurements.len(), 4);'
          new = '    assert_eq!(first.deferred_measurements.len(), 3);'
          if text.count(old) != 1:
              raise SystemExit('expected deferred measurement count')
          test.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/t079-implement.yml
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all -- --check || cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p sentrdel-cli --test t079_review_latency --test t077_release_benchmark
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/tests/t079_review_latency.rs crates/sentrdel-cli/tests/t077_release_benchmark.rs tests/benchmark/r1-release-suite.json .github/workflows/t079-implement.yml
          git commit -m 'test(bench): integrate T079 latency release dimension'
          git push origin HEAD:impl/001-t079-review-latency-benchmark
