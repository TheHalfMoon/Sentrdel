name: T079 Implementation

on:
  push:
    branches:
      - impl/001-t079-review-latency-benchmark

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: impl/001-t079-review-latency-benchmark
      - name: Integrate T079 release dimension
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          suite = Path('tests/benchmark/r1-release-suite.json')
          text = suite.read_text()
          marker = '"id": "review_latency"'
          start = text.index(marker)
          state = text.index('"state": "NOT_MEASURED"', start)
          owner = text.index('"owner_task": "T079"', state)
          if not (start < state < owner):
              raise SystemExit('unexpected review_latency dimension ordering')
          text = text[:state] + text[state:].replace('"state": "NOT_MEASURED"', '"state": "MEASURED"', 1)
          suite.write_text(text)

          test = Path('crates/sentrdel-cli/tests/t077_release_benchmark.rs')
          text = test.read_text()
          old_entry = '        ("review_latency", "T079"),\n'
          if text.count(old_entry) != 1:
              raise SystemExit('expected exactly one review_latency deferred entry')
          anchor = '    for (deferred, owner) in [\n'
          insert = (
              '    assert_eq!(dimensions["review_latency"].state, MetricState::Measured);\n'
              '    assert_eq!(dimensions["review_latency"].owner_task, "T079");\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one deferred measurement loop')
          text = text.replace(anchor, insert + anchor, 1).replace(old_entry, '', 1)
          old_count = '    assert_eq!(first.deferred_measurements.len(), 4);'
          if text.count(old_count) != 1:
              raise SystemExit('expected deferred measurement count')
          text = text.replace(old_count, '    assert_eq!(first.deferred_measurements.len(), 3);', 1)
          test.write_text(text)
          PY
          rm .github/workflows/t079-implement.yml
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p sentrdel-cli --test t079_review_latency -- --nocapture
          cargo +1.98.0 test -p sentrdel-cli --test t077_release_benchmark
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/tests/t079_review_latency.rs crates/sentrdel-cli/tests/t077_release_benchmark.rs tests/benchmark/r1-release-suite.json .github/workflows/t079-implement.yml
          git commit -m 'test(bench): integrate T079 latency release dimension'
          git push origin HEAD:impl/001-t079-review-latency-benchmark
