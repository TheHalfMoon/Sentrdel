name: T092 Governance Verification Probe 2

on:
  push:
    branches:
      - probe/t092-admin-verifier-2

permissions:
  contents: read

jobs:
  governance-verification-probe:
    name: T092 governance verification probe (non-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Detect bounded governance credential
        id: credential
        shell: bash
        env:
          DEDICATED_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ -n "${DEDICATED_TOKEN}" ]]; then
            echo "::add-mask::${DEDICATED_TOKEN}"
            echo "source=dedicated" >> "${GITHUB_OUTPUT}"
            echo "T092 verifier credential: dedicated"
          elif [[ -n "${FALLBACK_GH_TOKEN}" ]]; then
            echo "::add-mask::${FALLBACK_GH_TOKEN}"
            echo "source=gh_token" >> "${GITHUB_OUTPUT}"
            echo "T092 verifier credential: gh_token"
          else
            echo "source=none" >> "${GITHUB_OUTPUT}"
            echo "T092 verifier credential: BLOCKED_NO_BOUNDED_ADMIN_TOKEN"
          fi

      - name: Verify canonical main protection
        if: steps.credential.outputs.source != 'none'
        shell: bash
        env:
          DEDICATED_TOKEN: ${{ secrets.SENTRDEL_GOVERNANCE_ADMIN_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CREDENTIAL_SOURCE: ${{ steps.credential.outputs.source }}
        run: |
          if [[ "${CREDENTIAL_SOURCE}" == "dedicated" ]]; then
            export GH_TOKEN="${DEDICATED_TOKEN}"
          else
            export GH_TOKEN="${FALLBACK_GH_TOKEN}"
          fi
          python3 scripts/verify_repository_governance.py

      - name: Record fail-closed verification blocker
        if: steps.credential.outputs.source == 'none'
        run: |
          echo "T092 verification probe: BLOCKED_NO_BOUNDED_ADMIN_TOKEN"
