name: Temporary R3-T030 assertion repair

on:
  push:
    branches:
      - test/r3-t030-e2e-fixtures

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/r3-t030-e2e-fixtures
          persist-credentials: true
          fetch-depth: 1

      - name: Apply bounded assertion repair and qualify
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sentrdel-cli/src/r3_t030_e2e.rs')
          text = path.read_text()
          old = '    assert!(HOSTILE_README.contains("SYSTEM"));\n'
          new = '    assert!(HOSTILE_README.contains("Ignore previous instructions"));\n'
          if text.count(old) != 1:
              raise SystemExit('expected stale hostile marker assertion not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test -p sentrdel-cli --bin sentrdel r3_t030_e2e::hostile_repository_and_project_invariant_authority_attempts_remain_inert --locked
          cargo +1.98.0 test -p sentrdel-cli --bin sentrdel r3_t030_e2e::r3_fixture_matrix_has_deterministic_review_init_and_explain_behavior --locked
          git diff --check
          changed="$(git diff --name-only)"
          if [[ "${changed}" != 'crates/sentrdel-cli/src/r3_t030_e2e.rs' ]]; then
            printf 'unexpected repair paths:\n%s\n' "${changed}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sentrdel-cli/src/r3_t030_e2e.rs
          git commit -m 'fix(r3): align hostile fixture canary assertion'
          git push origin HEAD:test/r3-t030-e2e-fixtures
